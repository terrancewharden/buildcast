<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>BuildCast — AI Construction Timelapse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Crisp Chat — replace YOUR_WEBSITE_ID after creating account at crisp.chat -->
<script>window.$crisp=[];window.CRISP_WEBSITE_ID="YOUR_WEBSITE_ID";(function(){var d=document;var s=d.createElement("script");s.src="https://client.crisp.chat/l.js";s.async=1;d.getElementsByTagName("head")[0].appendChild(s);})();</script>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080909; --s1:#0E0F11; --s2:#141518; --s3:#1C1E23; --s4:#22252C;
  --border:#2A2D35; --border-light:#343840;
  --amber:#F59E0B; --amber-bright:#FCD34D;
  --amber-dim:rgba(245,158,11,0.08); --amber-glow:rgba(245,158,11,0.22);
  --green:#10B981; --red:#EF4444;
  --text:#F2F2F2; --text-2:#9CA3AF; --text-3:#4B5563;
  --r:12px; --r-lg:20px; --r-xl:32px;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
@keyframes glow{0%,100%{box-shadow:0 0 24px var(--amber-glow)}50%{box-shadow:0 0 56px rgba(245,158,11,0.5),0 0 100px rgba(245,158,11,0.15)}}
@keyframes bounceIn{0%{transform:scale(0.82);opacity:0}65%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes barFill{from{width:0%}to{width:var(--target-w)}}

.fade-up{animation:fadeUp 0.55s ease both}
.fade-up-1{animation:fadeUp 0.55s 0.1s ease both}
.fade-up-2{animation:fadeUp 0.55s 0.2s ease both}
.fade-up-3{animation:fadeUp 0.55s 0.32s ease both}
.fade-in{animation:fadeIn 0.4s ease both}
.bounce-in{animation:bounceIn 0.55s ease both}

/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 36px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;background:rgba(8,9,9,0.96);backdrop-filter:blur(24px)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:4px;cursor:pointer;display:flex;align-items:center}
.logo-accent{color:var(--amber)}
.nav-pill{font-size:11px;font-weight:700;letter-spacing:0.5px;background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,0.28);padding:5px 12px;border-radius:20px}

/* HOME */
.home{min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center}
.hero{width:100%;max-width:880px;padding:88px 32px 56px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:var(--amber-dim);border:1px solid rgba(245,158,11,0.25);border-radius:40px;padding:8px 18px;font-size:12px;font-weight:700;color:var(--amber);letter-spacing:0.5px}
.hero-badge-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:pulse 1.8s ease-in-out infinite}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(54px,9vw,100px);line-height:0.94;letter-spacing:2px}
.hero-em{color:var(--amber)}
.hero-sub{font-size:clamp(15px,2.2vw,19px);color:var(--text-2);line-height:1.65;max-width:540px;font-weight:400}
.hero-cta{display:inline-flex;align-items:center;gap:10px;background:var(--amber);color:#000;font-size:16px;font-weight:800;letter-spacing:0.4px;padding:17px 40px;border-radius:50px;border:none;cursor:pointer;box-shadow:0 0 40px var(--amber-glow);transition:all 0.2s;margin-top:4px}
.hero-cta:hover{background:var(--amber-bright);transform:translateY(-2px);box-shadow:0 0 64px rgba(245,158,11,0.55)}
.hero-arrow{font-size:18px;transition:transform 0.2s}
.hero-cta:hover .hero-arrow{transform:translateX(5px)}

/* Hero visual */
.hero-visual{width:100%;max-width:860px;padding:0 32px 88px;display:flex;align-items:center;justify-content:center}
.hv-card{flex:1;max-width:260px;aspect-ratio:9/16;border-radius:var(--r-xl);overflow:hidden;position:relative;border:1px solid var(--border)}
.hv-before{background:linear-gradient(155deg,#1a1611 0%,#2d1f08 55%,#111010 100%)}
.hv-after{background:linear-gradient(155deg,#081520 0%,#0d3025 55%,#081416 100%);animation:glow 3s ease-in-out infinite}
.hv-grid{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 29px,rgba(255,255,255,0.025) 29px,rgba(255,255,255,0.025) 30px),repeating-linear-gradient(90deg,transparent,transparent 29px,rgba(255,255,255,0.025) 29px,rgba(255,255,255,0.025) 30px)}
.hv-label{position:absolute;bottom:16px;left:16px;font-size:10px;font-weight:800;letter-spacing:2.5px;padding:4px 10px;border-radius:4px;background:rgba(0,0,0,0.55)}
.hv-before .hv-label{color:var(--text-3)}
.hv-after .hv-label{color:var(--amber)}
.hv-mid{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 28px;color:var(--amber)}
.hv-ai-bubble{width:52px;height:52px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;color:#000;box-shadow:0 0 36px var(--amber-glow);animation:glow 2.4s ease-in-out infinite}
.hv-line{width:2px;height:44px;background:linear-gradient(transparent,var(--amber) 50%,transparent)}

/* HOW IT WORKS */
.how{width:100%;max-width:860px;padding:0 32px 100px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.how-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 22px;transition:border-color 0.2s}
.how-card:hover{border-color:var(--border-light)}
.how-num{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:1px;line-height:1;margin-bottom:12px;color:var(--s4)}
.how-card:last-child .how-num{color:rgba(245,158,11,0.18)}
.how-icon{font-size:28px;margin-bottom:12px}
.how-title{font-size:15px;font-weight:700;margin-bottom:8px}
.how-desc{font-size:13px;color:var(--text-2);line-height:1.6}

/* UPLOAD SCREEN */
.upload-screen{max-width:840px;margin:0 auto;padding:52px 32px 100px}
.screen-h1{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:2px;margin-bottom:8px}
.screen-sub{font-size:15px;color:var(--text-2);margin-bottom:40px}

.upload-pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:32px}
.upload-zone{aspect-ratio:3/4;border:2px dashed var(--border);border-radius:var(--r-lg);cursor:pointer;position:relative;overflow:hidden;transition:border-color 0.2s,background 0.2s;background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--amber);background:var(--amber-dim)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:10;font-size:0}
.uz-tag{position:absolute;top:14px;left:14px;font-size:9px;font-weight:800;letter-spacing:2.5px;padding:4px 10px;border-radius:4px;background:var(--s3);z-index:5}
.uz-tag.before{color:var(--text-2)}
.uz-tag.after{color:var(--amber);background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.2)}
.uz-icon{font-size:38px;opacity:0.35}
.uz-hint{font-size:13px;color:var(--text-3);text-align:center;padding:0 16px;line-height:1.5}
.uz-thumb{position:absolute;inset:0;object-fit:cover;width:100%;height:100%;z-index:3}
.uz-check{position:absolute;top:12px;right:12px;width:26px;height:26px;background:var(--amber);color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;z-index:6}
.uz-replace{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.72);padding:10px;text-align:center;font-size:12px;font-weight:600;color:var(--text-2);opacity:0;transition:opacity 0.2s;z-index:7}
.upload-zone:hover .uz-replace{opacity:1}

/* Config */
.cfg-section{margin-bottom:20px;background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:20px 20px 16px}
.cfg-label{font-size:12px;font-weight:900;letter-spacing:1.8px;color:var(--amber);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cfg-step-num{width:22px;height:22px;border-radius:50%;background:var(--amber);color:#000;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type-pill{padding:11px 8px;text-align:center;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:600;background:var(--s1);color:var(--text-2);transition:all 0.15s;line-height:1.3}
.type-pill:hover{border-color:var(--amber);color:var(--text)}
.type-pill.sel{border-color:var(--amber);background:var(--amber-dim);color:var(--amber)}
.fmt-row{display:flex;gap:10px}
.fmt-btn{flex:1;padding:13px 8px;border:1px solid var(--border);border-radius:var(--r);background:var(--s1);color:var(--text-2);cursor:pointer;font-size:12px;font-weight:600;text-align:center;transition:all 0.15s}
.fmt-btn:hover{border-color:var(--amber)}
.fmt-btn.sel{border-color:var(--amber);background:var(--amber-dim);color:var(--amber)}
.fmt-icon{font-size:22px;display:block;margin-bottom:5px}

/* Generate button */
.gen-btn{width:100%;padding:19px;background:var(--amber);color:#000;font-size:17px;font-weight:900;letter-spacing:0.4px;border:none;border-radius:50px;cursor:pointer;box-shadow:0 0 40px var(--amber-glow);transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:10px}
.gen-btn:hover:not(:disabled){background:var(--amber-bright);transform:translateY(-2px);box-shadow:0 0 64px rgba(245,158,11,0.5)}
.gen-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none;box-shadow:none;background:var(--s3);color:var(--text-3)}

/* PROCESSING SCREEN */
.proc-screen{max-width:580px;margin:0 auto;padding:80px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:44px}
.proc-ring{width:82px;height:82px;border:3px solid var(--s4);border-top-color:var(--amber);border-radius:50%;animation:spin 0.85s linear infinite}
.proc-h1{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:2px;margin-bottom:8px}
.proc-phase{font-size:15px;color:var(--text-2);min-height:22px;transition:all 0.3s}
.proc-bar-wrap{width:100%;height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
.proc-bar{height:100%;background:linear-gradient(90deg,var(--amber),var(--amber-bright));border-radius:3px;transition:width 0.7s ease}
.proc-pct{text-align:right;font-size:12px;color:var(--text-3);margin-top:7px}
.proc-steps{width:100%;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--s1)}
.proc-step{display:flex;align-items:center;gap:16px;padding:15px 20px;border-bottom:1px solid var(--border)}
.proc-step:last-child{border-bottom:none}
.ps-dot{width:28px;height:28px;min-width:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--s3);color:var(--text-3);transition:all 0.3s}
.ps-dot.done{background:var(--amber);color:#000}
.ps-dot.active{background:transparent;border:2px solid var(--amber);color:var(--amber);animation:pulse 1.1s ease-in-out infinite}
.ps-text{font-size:14px;font-weight:500;color:var(--text-3);transition:color 0.3s}
.ps-text.done{color:var(--text)}
.ps-text.active{color:var(--text);font-weight:600}
.proc-note{font-size:13px;color:var(--text-3);background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;line-height:1.6}

/* RESULT SCREEN */
.result-screen{max-width:680px;margin:0 auto;padding:52px 32px 100px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:30px}
.result-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);border-radius:40px;padding:8px 18px;font-size:13px;font-weight:700;color:var(--green)}
.result-h1{font-family:'Bebas Neue',sans-serif;font-size:52px;letter-spacing:2px;line-height:1}
.video-container{position:relative;width:100%;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--border);background:#000;box-shadow:0 0 80px rgba(0,0,0,0.7)}
.video-container.portrait{max-width:340px}
.video-container video{width:100%;display:block}
.result-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
.btn-amber{flex:1;min-width:150px;padding:16px 28px;background:var(--amber);color:#000;font-size:15px;font-weight:800;border:none;border-radius:50px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 30px var(--amber-glow)}
.btn-amber:hover:not(:disabled){background:var(--amber-bright);transform:translateY(-2px)}
.btn-amber:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-ghost{flex:1;min-width:150px;padding:16px 28px;background:transparent;color:var(--text);font-size:15px;font-weight:700;border:1px solid var(--border);border-radius:50px;cursor:pointer;transition:all 0.2s}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
.result-note{font-size:13px;color:var(--text-3)}

/* ERROR */
.err-box{background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.28);border-radius:var(--r);padding:16px 20px;font-size:14px;color:var(--red);text-align:left;line-height:1.55}

/* HELP CHAT BUTTON */
.help-btn{position:fixed;bottom:24px;right:24px;z-index:500;width:52px;height:52px;border-radius:50%;background:var(--amber);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 20px rgba(245,158,11,0.4);transition:transform 0.2s}
.help-btn:hover{transform:scale(1.1)}
.help-badge{position:absolute;top:-2px;right:-2px;width:16px;height:16px;background:var(--red);border-radius:50%;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff}

/* AUTH MODAL */
.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.auth-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-xl);padding:36px 32px;width:100%;max-width:420px;position:relative;animation:bounceIn 0.4s ease both}
.auth-tab-row{display:flex;gap:0;margin-bottom:28px;background:var(--s2);border-radius:10px;padding:4px}
.auth-tab{flex:1;padding:10px;border:none;background:transparent;color:var(--text-2);font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;transition:all 0.15s}
.auth-tab.active{background:var(--amber);color:#000}
.auth-input{width:100%;padding:13px 16px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:14px;margin-bottom:12px;outline:none;transition:border-color 0.15s}
.auth-input:focus{border-color:var(--amber)}
.auth-input::placeholder{color:var(--text-3)}

/* SOCIAL SHARE */
.social-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.social-btn{flex:1;min-width:120px;padding:13px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--s2);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:5px}
.social-btn:hover{border-color:var(--amber);background:var(--amber-dim);color:var(--amber)}
.social-btn-icon{font-size:20px}

/* NAV USER */
.nav-user{display:flex;align-items:center;gap:10px}
.nav-user-email{font-size:11px;color:var(--text-2);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-login-btn{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-dim);border:1px solid rgba(245,158,11,0.28);padding:5px 12px;border-radius:20px;cursor:pointer}

/* SECONDARY TOOLS — home cards */
.tools-section{width:100%;max-width:860px;padding:0 32px 100px}
.tools-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text-3);text-transform:uppercase;margin-bottom:20px}
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tool-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 24px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.tool-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity 0.2s;background:var(--amber-dim)}
.tool-card:hover{border-color:var(--amber);transform:translateY(-2px)}
.tool-card:hover::before{opacity:1}
.tool-card-icon{font-size:32px;margin-bottom:14px}
.tool-card-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;margin-bottom:8px}
.tool-card-desc{font-size:13px;color:var(--text-2);line-height:1.6}
.tool-card-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:1.5px;padding:3px 8px;border-radius:4px;background:rgba(139,92,246,0.18);color:#A78BFA;border:1px solid rgba(139,92,246,0.3);margin-top:12px}

.mz-remove{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,0.75);color:#fff;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:5}

/* SHOT GUIDE MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:500;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px);animation:fadeIn 0.2s ease}
.modal-sheet{background:var(--s2);border-radius:28px 28px 0 0;width:100%;max-width:760px;max-height:88vh;overflow-y:auto;padding:32px 32px 48px;animation:fadeUp 0.3s ease}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 28px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;margin-bottom:6px}
.modal-sub{font-size:14px;color:var(--text-2);margin-bottom:28px}
.guide-tabs{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}
.guide-tab{padding:8px 16px;border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s;color:var(--text-2)}
.guide-tab.sel{border-color:var(--amber);background:var(--amber-dim);color:var(--amber)}
.guide-diagram{background:var(--s3);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}
.guide-frame{background:var(--s4);border:2px solid var(--amber);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.guide-frame-label{position:absolute;bottom:-22px;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--amber);white-space:nowrap}
.guide-safe{position:absolute;border:1px dashed rgba(245,158,11,0.45);border-radius:4px}
.guide-person{position:absolute;font-size:18px}
.guide-tips-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.guide-tip{background:var(--s3);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.guide-tip-icon{font-size:20px;margin-bottom:8px}
.guide-tip-title{font-size:13px;font-weight:700;margin-bottom:4px}
.guide-tip-body{font-size:12px;color:var(--text-2);line-height:1.6}
.guide-tip.good{border-color:rgba(16,185,129,0.3);background:rgba(16,185,129,0.05)}
.guide-tip.bad{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05)}

/* ─── Job Board constants ─────────────────────────────────── */
const JOB_TYPES_BOARD = ['Roofing','Landscaping','Kitchen Renovation','Bathroom Remodel','New Construction','Painting','Flooring','Other'];

const MILESTONE_CONFIG = [
  { label:'Ready to Start', color:'#6B7280', bg:'rgba(107,114,128,0.1)', pct:0   },
  { label:'In Progress',    color:'#F59E0B', bg:'rgba(245,158,11,0.1)',  pct:33  },
  { label:'Wrapping Up',    color:'#8B5CF6', bg:'rgba(139,92,246,0.1)', pct:66  },
  { label:'Complete',       color:'#10B981', bg:'rgba(16,185,129,0.1)', pct:100 },
];

/* ─── Toast helper ────────────────────────────────────────── */
function Toast({ msg, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2400); return () => clearTimeout(t); }, []);
  return <div className="bc-toast">✓ {msg}</div>;
}

/* ─── AddJobModal ─────────────────────────────────────────── */
function AddJobModal({ onSave, onClose, token, editJob }) {
  const [jobName,    setJobName]    = useState(editJob?.job_name    || '');
  const [clientName, setClientName] = useState(editJob?.client_name || '');
  const [jobType,    setJobType]    = useState(editJob?.job_type    || JOB_TYPES_BOARD[0]);
  const [startDate,  setStartDate]  = useState(editJob?.start_date?.slice(0,10) || '');
  const [endDate,    setEndDate]    = useState(editJob?.end_date?.slice(0,10)   || '');
  const [saving,     setSaving]     = useState(false);
  const [err,        setErr]        = useState('');

  const save = async () => {
    if (!jobName.trim()) { setErr('Job name is required.'); return; }
    setSaving(true); setErr('');
    try {
      const method = editJob ? 'PUT' : 'POST';
      const url    = editJob ? `/api/jobs/${editJob.id}` : '/api/jobs';
      const r = await fetch(url, {
        method,
        headers: { 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
        body: JSON.stringify({ jobName: jobName.trim(), clientName: clientName.trim()||null, jobType, startDate: startDate||null, endDate: endDate||null }),
      });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      onSave(d.job);
    } catch(e) { setErr(e.message); setSaving(false); }
  };

  return (
    <div className="auth-overlay" onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div className="auth-card" style={{maxWidth:460}}>
        <button className="modal-close" onClick={onClose} style={{position:'absolute',top:16,right:16}}>✕</button>
        <div style={{textAlign:'center',marginBottom:20}}>
          <div style={{fontSize:28,marginBottom:8}}></div>
          <div style={{fontSize:17,fontWeight:900,letterSpacing:0.3}}>{editJob ? 'Edit Job' : 'Add New Job'}</div>
        </div>

        <div style={{fontSize:11,fontWeight:700,color:'var(--text-2)',letterSpacing:1,marginBottom:6}}>JOB NAME *</div>
        <input className="auth-input" placeholder="e.g. Smith Residence Roof" value={jobName} onChange={e=>setJobName(e.target.value)} style={{marginBottom:14}} />

        <div style={{fontSize:11,fontWeight:700,color:'var(--text-2)',letterSpacing:1,marginBottom:6}}>CLIENT NAME</div>
        <input className="auth-input" placeholder="e.g. John Smith" value={clientName} onChange={e=>setClientName(e.target.value)} style={{marginBottom:14}} />

        <div style={{fontSize:11,fontWeight:700,color:'var(--text-2)',letterSpacing:1,marginBottom:6}}>JOB TYPE</div>
        <div className="type-grid" style={{marginBottom:14}}>
          {JOB_TYPES_BOARD.map(t => (
            <div key={t} className={`type-pill${jobType===t?' sel':''}`} onClick={()=>setJobType(t)} style={{fontSize:11}}>{t}</div>
          ))}
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--text-2)',letterSpacing:1,marginBottom:6}}>START DATE</div>
            <input className="auth-input" type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={{marginBottom:0}} />
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--text-2)',letterSpacing:1,marginBottom:6}}>END DATE</div>
            <input className="auth-input" type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} style={{marginBottom:0}} />
          </div>
        </div>

        {err && <div className="err-box" style={{marginBottom:12}}>⚠ {err}</div>}
        <button className="btn-amber" onClick={save} disabled={saving} style={{width:'100%'}}>
          {saving ? '⟳ Saving...' : editJob ? '✓ Update Job' : '+ Add Job'}
        </button>
      </div>
    </div>
  );
}

/* ─── JobBoardScreen ──────────────────────────────────────── */
function JobBoardScreen({ token, onBuildCast, onJobsChange, onNavigate }) {
  const [jobs,       setJobsLocal]  = useState([]);
  const [loading,    setLoading]    = useState(true);
  const [showModal,  setShowModal]  = useState(false);
  const [editJob,    setEditJob]    = useState(null);
  const [toast,      setToast]      = useState('');

  const setJobs = (val) => {
    setJobsLocal(val);
    if (onJobsChange) onJobsChange(typeof val === 'function' ? val([]) : val);
  };

  const loadJobs = async () => {
    setLoading(true);
    try {
      const r = await fetch('/api/jobs', { headers:{ Authorization:`Bearer ${token}` } });
      const d = await r.json();
      const fetched = d.jobs || [];
      setJobsLocal(fetched);
      if (onJobsChange) onJobsChange(fetched);
    } catch {}
    setLoading(false);
  };

  useEffect(() => { loadJobs(); }, []);

  const handleSave = (job) => {
    setShowModal(false); setEditJob(null);
    loadJobs();
    setToast(editJob ? 'Job updated!' : 'Job added!');
  };

  const advanceMilestone = async (job) => {
    if (job.milestone >= 4) return;
    const newMs = job.milestone + 1;
    await fetch(`/api/jobs/${job.id}`, {
      method: 'PUT',
      headers: { 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
      body: JSON.stringify({ milestone: newMs }),
    });
    setJobs(prev => prev.map(j => j.id===job.id ? {...j, milestone: newMs} : j));
    const m = MILESTONE_CONFIG[newMs-1];
    setToast(`Moved to "${m.label}"`);
  };

  const deleteJob = async (jobId) => {
    if (!confirm('Delete this job?')) return;
    await fetch(`/api/jobs/${jobId}`, { method:'DELETE', headers:{ Authorization:`Bearer ${token}` } });
    setJobs(prev => prev.filter(j => j.id !== jobId));
    setToast('Job deleted');
  };

  const milestoneCtaLabel = (ms) => {
    if (ms === 1) return '▶ Mark In Progress';
    if (ms === 2) return '▶ Mark Wrapping Up';
    if (ms === 3) return ' Upload After & BuildCast It';
    return null;
  };

  return (
    <div className="upload-screen fade-in">
      {toast && <Toast msg={toast} onDone={() => setToast('')} />}
      {(showModal || editJob) && (
        <AddJobModal
          token={token}
          editJob={editJob}
          onSave={handleSave}
          onClose={() => { setShowModal(false); setEditJob(null); }}
        />
      )}

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
        <div>
          <h1 className="screen-h1" style={{marginBottom:4}}>Job Board</h1>
          <p className="screen-sub" style={{marginBottom:0}}>Track your active projects from first day to final reveal.</p>
        </div>
        <button className="btn-amber" onClick={() => setShowModal(true)} style={{flexShrink:0,padding:'10px 18px',fontSize:13}}>
          + Add New Job
        </button>
      </div>

      {loading ? (
        <div style={{textAlign:'center',padding:'60px 20px',color:'var(--text-3)',fontSize:14}}>Loading jobs...</div>
      ) : jobs.length === 0 ? (
        <div className="jb-empty">
          <div className="jb-empty-icon"></div>
          <div className="jb-empty-h">No jobs yet</div>
          <div style={{fontSize:13,marginBottom:24,lineHeight:1.6}}>Add your first job to start tracking milestones, build your portfolio, and create BuildCast content from every project.</div>
          <button className="btn-amber" onClick={() => setShowModal(true)}>+ Add Your First Job</button>
        </div>
      ) : (
        <div className="jb-grid">
          {jobs.map(job => {
            const ms = MILESTONE_CONFIG[(job.milestone||1)-1];
            const pct = ms.pct;
            const ctaLabel = milestoneCtaLabel(job.milestone||1);
            return (
              <div key={job.id} className="jb-card">
                {/* Progress bar */}
                <div className="jb-milestone-bar">
                  <div className="jb-milestone-fill" style={{width:`${pct}%`,background:ms.color}} />
                </div>
                <div className="jb-card-body">
                  <div className="jb-type-badge">{job.job_type || 'General'}</div>
                  <div className="jb-name">{job.job_name}</div>
                  {job.client_name && <div className="jb-client">Client: {job.client_name}</div>}
                  <div className="jb-meta">
                    {job.start_date && <span>Start: {new Date(job.start_date).toLocaleDateString()}</span>}
                    {job.end_date   && <span>End: {new Date(job.end_date).toLocaleDateString()}</span>}
                  </div>

                  {/* Milestone status banner */}
                  <div className="jb-milestone-status" style={{background:ms.bg,color:ms.color,border:`1px solid ${ms.color}30`}}>
                    <span>{ms.label}</span>
                    <span style={{fontSize:11,opacity:0.7}}>Step {job.milestone||1} of 4</span>
                  </div>

                  {/* CTA */}
                  {ctaLabel && (
                    <button
                      onClick={() => {
                        if ((job.milestone||1) === 3) {
                          onBuildCast && onBuildCast(job);
                        } else {
                          advanceMilestone(job);
                        }
                      }}
                      className={`jb-btn jb-btn-primary`}
                      style={{width:'100%',marginBottom:8,padding:'9px 12px',textAlign:'center'}}
                    >
                      {ctaLabel}
                    </button>
                  )}
                  {(job.milestone||1) === 4 && (
                    <button onClick={() => onBuildCast && onBuildCast(job)}
                      className="jb-btn jb-btn-primary"
                      style={{width:'100%',marginBottom:8,padding:'9px 12px',textAlign:'center'}}>
                       Create BuildCast Video
                    </button>
                  )}

                  {/* Actions */}
                  <div className="jb-actions">
                    <button className="jb-btn" onClick={() => setEditJob(job)} style={{flex:1}}> Edit</button>
                    {(job.milestone||1) < 4 && (
                      <button className="jb-btn" onClick={() => advanceMilestone(job)} style={{flex:1}}>▶ Advance</button>
                    )}
                    <button className="jb-btn jb-btn-danger" onClick={() => deleteJob(job.id)}></button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ─── Utilities ──────────────────────────────────────────── */
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Burn a brand watermark into a video — returns { url, ext } or throws */
async function applyWatermarkToVideo(videoUrl, wmConfig, onProgress) {
  // Load logo image if provided
  let logoImg = null;
  if (wmConfig.logo) {
    logoImg = await new Promise(resolve => {
      const img = new Image();
      img.onload  = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = wmConfig.logo;
    });
  }

  // Load video metadata
  const video = document.createElement('video');
  video.crossOrigin = 'anonymous';
  video.muted = true;
  video.playsInline = true;
  await new Promise((resolve, reject) => {
    video.onloadedmetadata = resolve;
    video.onerror = () => reject(new Error('Could not load video'));
    video.src = videoUrl;
  });

  const W = video.videoWidth  || 720;
  const H = video.videoHeight || 1280;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');

  // Draw watermark overlay onto canvas context
  function drawWM(ctx) {
    const pad      = Math.round(W * 0.035);
    const fontSize = Math.max(12, Math.round(H * 0.025));
    const logoH    = logoImg ? Math.round(H * 0.065) : 0;
    const lines    = [wmConfig.website, wmConfig.phone].filter(Boolean);
    const textH    = lines.length * (fontSize + 5);
    const bgH      = pad + logoH + (logoH && lines.length ? 8 : 0) + textH + pad;
    const bgW      = Math.min(Math.round(W * 0.58), W - pad * 2);

    // Semi-transparent pill background (bottom-left)
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.62)';
    const bx = pad, by = H - pad - bgH;
    const rx = 8;
    ctx.beginPath();
    ctx.moveTo(bx + rx, by); ctx.lineTo(bx + bgW - rx, by);
    ctx.quadraticCurveTo(bx + bgW, by,       bx + bgW, by + rx);
    ctx.lineTo(bx + bgW, by + bgH - rx);
    ctx.quadraticCurveTo(bx + bgW, by + bgH, bx + bgW - rx, by + bgH);
    ctx.lineTo(bx + rx,  by + bgH);
    ctx.quadraticCurveTo(bx, by + bgH,       bx, by + bgH - rx);
    ctx.lineTo(bx, by + rx);
    ctx.quadraticCurveTo(bx, by,             bx + rx, by);
    ctx.closePath(); ctx.fill(); ctx.restore();

    let cy = by + pad;

    // Logo
    if (logoImg && logoH) {
      const aspect = logoImg.width / (logoImg.height || 1);
      const lw = Math.min(Math.round(logoH * aspect), bgW - pad * 2);
      ctx.drawImage(logoImg, pad + pad / 2, cy, lw, logoH);
      cy += logoH + 8;
    }

    // Text lines
    ctx.fillStyle = '#ffffff';
    ctx.font = `700 ${fontSize}px Inter, Arial, sans-serif`;
    lines.forEach(line => {
      ctx.fillText(line, pad + pad / 2, cy + fontSize);
      cy += fontSize + 5;
    });
  }

  // Capture stream from canvas
  const mimeType = MediaRecorder.isTypeSupported('video/mp4;codecs=h264')
    ? 'video/mp4;codecs=h264'
    : MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : 'video/webm';

  const stream   = canvas.captureStream(30);
  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 4_000_000 });
  const chunks   = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  const recordDone = new Promise(r => { recorder.onstop = r; });
  recorder.start(100);

  const dur = video.duration || 10;

  // Process frames using requestVideoFrameCallback (preferred) or rAF fallback
  await new Promise((resolve) => {
    const onFrame = () => {
      if (video.ended || video.paused && video.currentTime >= dur - 0.05) { resolve(); return; }
      ctx.drawImage(video, 0, 0, W, H);
      drawWM(ctx);
      if (onProgress) onProgress(Math.min(video.currentTime / dur, 0.99));
      if ('requestVideoFrameCallback' in video) {
        video.requestVideoFrameCallback(onFrame);
      } else {
        requestAnimationFrame(onFrame);
      }
    };
    video.onended = () => resolve();
    if ('requestVideoFrameCallback' in video) {
      video.requestVideoFrameCallback(onFrame);
    } else {
      requestAnimationFrame(onFrame);
    }
    video.play().catch(() => {});
  });

  // Let recorder capture last chunk then stop
  await sleep(250);
  recorder.stop();
  await recordDone;

  const ext  = mimeType.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(chunks, { type: mimeType });
  return { url: URL.createObjectURL(blob), ext };
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload  = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function resizeImage(dataUrl, maxDim = 1024) {
  return new Promise(resolve => {
    const img = new Image();
    if (dataUrl && !dataUrl.startsWith('data:')) img.crossOrigin = 'anonymous';
    img.onload = () => {
      const scale  = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.round(img.width  * scale);
      const h = Math.round(img.height * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

/* ─── API ────────────────────────────────────────────────── */
async function startGeneration(before, after, projectType, aspect, duration) {
  const r = await fetch('/api/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ before, after, projectType, aspectRatio: aspect, duration }),
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  // Return fal.ai's own status/response URLs so polling uses the right paths
  return { requestId: d.requestId, statusUrl: d.statusUrl, responseUrl: d.responseUrl };
}

async function startGeneration30s(before, mid, after, projectType, aspect) {
  const r = await fetch('/api/generate-30s', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ before, mid, after, projectType, aspectRatio: aspect }),
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d; // { clip1: { requestId, statusUrl, responseUrl }, clip2: {...} }
}

async function pollStatus(statusUrl, responseUrl) {
  const params = new URLSearchParams({ id: statusUrl, statusUrl, responseUrl });
  const r = await fetch(`/api/status?${params}`);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d; // { status, videoUrl? }
}

/* ─── UploadZone ─────────────────────────────────────────── */
function UploadZone({ label, image, onUpload }) {
  const [drag, setDrag] = useState(false);

  const handleFiles = async files => {
    const file = files?.[0];
    if (!file) return;
    try {
      const dataUrl = await readFileAsDataUrl(file);
      onUpload(dataUrl);
    } catch(e) { console.error('File read error:', e); }
  };

  return (
    <div
      className={`upload-zone${drag ? ' drag-over' : ''}`}
      onDragOver={e => { e.preventDefault(); setDrag(true); }}
      onDragLeave={() => setDrag(false)}
      onDrop={e => { e.preventDefault(); setDrag(false); handleFiles(e.dataTransfer.files); }}
    >
      <input
        type="file"
        accept="image/*,image/heic,image/heif"
        onChange={e => handleFiles(e.target.files)}
      />
      <div className={`uz-tag ${label.toLowerCase()}`}>{label}</div>
      {image ? (
        <>
          <img src={image} className="uz-thumb" alt={label} />
          <div className="uz-check">✓</div>
          <div className="uz-replace">Tap to replace</div>
        </>
      ) : (
        <>
          <div className="uz-icon">{label === 'BEFORE' ? '' : ''}</div>
          <div className="uz-hint">{label === 'BEFORE' ? 'Day one on site' : 'Completed project'}</div>
        </>
      )}
    </div>
  );
}

function HelpModal({ currentUser, onClose }) {

  const [error,   setError]   = useState('');

  const send = async () => {
    if (!name.trim() || !email.trim() || !message.trim()) { setError('Please fill in all fields.'); return; }
    setLoading(true); setError('');
    try {
      const r = await fetch('/api/messages/send', {

  return (
    <div className="auth-overlay" onClick={e => { if(e.target===e.currentTarget) onClose(); }}>

              We'll get back to you at <strong>{email}</strong> as soon as possible.
            </div>
            <button className="btn-amber" onClick={onClose} style={{width:'100%'}}>Done</button>
          </div>
        ) : (
          <>
            <div style={{textAlign:'center',marginBottom:24}}>
              <div style={{fontSize:36,marginBottom:10}}></div>

}

              </div>
              <input type="file" accept="image/*" onChange={handleLogoUpload} style={{position:'absolute',opacity:0,width:0,height:0}} />
            </label>
          </div>

          <input className="auth-input" type="text" placeholder="Website (yourbusiness.com)"
            value={wmWebsite} onChange={e => setWmWebsite(e.target.value)} style={{marginBottom:10}} />
          <input className="auth-input" type="tel" placeholder="Phone number"
            value={wmPhone} onChange={e => setWmPhone(e.target.value)} />

          <button className="btn-amber" onClick={saveWatermarkAndContinue}
            disabled={wmSaving} style={{width:'100%',marginTop:18}}>
            {wmSaving
              ? <span style={{display:'flex',alignItems:'center',gap:8,justifyContent:'center'}}>
                  <span style={{display:'inline-block',width:15,height:15,border:'2px solid #000',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.8s linear infinite'}} /> Saving...
                </span>
              : '↓  Save & Download Video'}
          </button>
          <button onClick={() => onSuccess(pendingUser, null)}
            style={{width:'100%',marginTop:8,padding:'11px',background:'none',border:'1px solid var(--border)',borderRadius:50,color:'var(--text-2)',fontSize:13,fontWeight:600,cursor:'pointer'}}>
            Skip for now
          </button>
          <div style={{fontSize:11,color:'var(--text-3)',textAlign:'center',marginTop:10}}>
            You can add this later from the profile menu
          </div>
        </div>
      </div>
    );
  }

  // ── Step 1: Credentials ──
  return (
    <div className="auth-overlay" onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div className="auth-card">
        <button className="modal-close" onClick={onClose} style={{position:'absolute',top:16,right:16}}>✕</button>

        <div style={{textAlign:'center',marginBottom:24}}>
          <div style={{fontSize:36,marginBottom:10}}></div>
          <div style={{fontSize:20,fontWeight:900,letterSpacing:0.5,marginBottom:6}}>
            {tab === 'signup' ? 'Save Your Video' : 'Welcome Back'}
          </div>
          <div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.6}}>
            {tab === 'signup'
              ? 'Create a free account to download and keep your timelapse.'
              : 'Log in to download your timelapse.'}
          </div>
        </div>

        <div className="auth-tab-row">
          <button className={`auth-tab${tab==='signup'?' active':''}`} onClick={() => { setTab('signup'); setError(''); }}>
            Create Account
          </button>
          <button className={`auth-tab${tab==='login'?' active':''}`} onClick={() => { setTab('login'); setError(''); }}>
            Log In
          </button>
        </div>

        <input
          className="auth-input" type="email" placeholder="Email address"
          value={email} onChange={e => setEmail(e.target.value)} onKeyDown={handleKey}
          autoFocus
        />
        <input
          className="auth-input" type="password"
          placeholder={tab === 'signup' ? 'Create a password (6+ chars)' : 'Password'}
          value={password} onChange={e => setPassword(e.target.value)} onKeyDown={handleKey}
        />

        {error && <div className="err-box" style={{marginBottom:12,marginTop:4}}>⚠ {error}</div>}

        <button className="btn-amber" onClick={submit} disabled={loading || !email || !password}
          style={{width:'100%',marginTop:4}}>
          {loading
            ? <span style={{display:'flex',alignItems:'center',gap:8,justifyContent:'center'}}>
                <span style={{display:'inline-block',width:16,height:16,border:'2px solid #000',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.8s linear infinite'}} />
                {tab === 'signup' ? 'Creating account...' : 'Logging in...'}
              </span>
            : tab === 'signup' ? '↓  Create Account & Download' : '↓  Log In & Download'
          }
        </button>

        <div style={{fontSize:11,color:'var(--text-3)',textAlign:'center',marginTop:12,lineHeight:1.5}}>
          Free to create · No credit card · Download your videos anytime
        </div>
      </div>
    </div>
  );
}

/* ─── UpgradeModal ───────────────────────────────────────── */
function UpgradeModal({ feature, tier, price, planId, onClose }) {
  const [loading, setLoading] = useState(false);

  const checkout = async () => {
    setLoading(true);
    try {
      const r = await fetch('/api/checkout', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ plan: planId }),
      });
      const d = await r.json();
      if (d.url) window.location.href = d.url;
    } catch(e) {
      setLoading(false);
    }
  };

  const tierColor   = tier === 'Studio' ? '#A78BFA' : 'var(--amber)';
  const tierBg      = tier === 'Studio' ? 'rgba(139,92,246,0.08)' : 'rgba(245,158,11,0.08)';
  const tierBorder  = tier === 'Studio' ? 'rgba(139,92,246,0.25)' : 'rgba(245,158,11,0.25)';

  return (
    <div className="modal-overlay" onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-sheet" style={{position:'relative',textAlign:'center'}}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="modal-handle"></div>

        <div style={{fontSize:48,marginBottom:16}}></div>
        <div style={{fontSize:20,fontWeight:900,letterSpacing:0.5,marginBottom:8}}>{feature}</div>
        <div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.6,marginBottom:24}}>
          This feature is available on the{' '}
          <span style={{color:tierColor,fontWeight:800}}>{tier} plan</span>
          {tier === 'Studio' ? ' and above' : ' and up'}. Upgrade to unlock it.
        </div>

        <div style={{background:tierBg,border:`1px solid ${tierBorder}`,borderRadius:14,
          padding:'18px 20px',marginBottom:24}}>
          <div style={{fontSize:13,fontWeight:700,color:tierColor,marginBottom:6,letterSpacing:1}}>{tier.toUpperCase()} PLAN</div>
          <div style={{fontSize:30,fontWeight:900,color:'var(--text)',marginBottom:4}}>{price}<span style={{fontSize:14,fontWeight:500,color:'var(--text-3)'}}>/mo</span></div>
          {tier === 'Studio'
            ? <div style={{fontSize:12,color:'var(--text-3)'}}>30-sec videos · Project Preview · Everything in Pro</div>
            : <div style={{fontSize:12,color:'var(--text-3)'}}>Project Preview · 15-sec videos · Unlimited timelapses</div>}
        </div>

        <button className="btn-amber" onClick={checkout} disabled={loading}
          style={{width:'100%',marginBottom:12,background:tier==='Studio'?'#7C3AED':'var(--amber)',
            boxShadow:tier==='Studio'?'0 0 30px rgba(124,58,237,0.4)':'0 0 30px var(--amber-glow)'}}>
          {loading ? '⟳ Redirecting...' : `Upgrade to ${tier} — ${price}/mo`}
        </button>
        <button className="btn-ghost" onClick={onClose} style={{width:'100%'}}>Not now</button>
      </div>
    </div>
  );
}

/* ─── ProjectPreviewScreen (Bid Mode) ───────────────────── */
function ProjectPreviewScreen({ onBack, initialBefore, onUseAsAfter, token, currentUser, jobs }) {
  const [before,      setBefore]      = useState(initialBefore || null);
  const [projType,    setProjType]    = useState('Residential New Construction');
  const [selStyle,    setSelStyle]    = useState(null);
  const [custom,      setCustom]      = useState('');
  const [loading,     setLoading]     = useState(false);
  const [result,      setResult]      = useState(null);
  const [error,       setError]       = useState('');
  const [phase,       setPhase]       = useState('');
  const [showBefore,  setShowBefore]  = useState(false);
  const [attachJobId, setAttachJobId] = useState('');
  const [pastBids,    setPastBids]    = useState([]);
  const [bidsLoaded,  setBidsLoaded]  = useState(false);

  const styles = STYLE_PROMPTS[projType] || [];
  const canGen = before && selStyle;

  const handleProjType = (t) => { setProjType(t); setSelStyle(null); setResult(null); };

  // Load past bids once
  useEffect(() => {
    if (!token || bidsLoaded) return;
    fetch('/api/bids', { headers:{ Authorization:`Bearer ${token}` } })
      .then(r => r.json()).then(d => { setPastBids(d.bids||[]); setBidsLoaded(true); }).catch(() => {});
  }, [token]);

  const generate = async () => {
    if (!canGen) return;
    setLoading(true); setError(''); setResult(null); setPhase('Analyzing your photo...');
    try {
      // Resize before photo
      const rb = await resizeImage(before, 1024);

      // Build full style prompt
      const promptBase = selStyle.prompt;
      const fullPrompt = custom.trim()
        ? `${promptBase}, ${custom.trim()}`
        : promptBase;

      setPhase('Generating your project preview...');
      const r = await fetch('/api/generate-preview', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ beforeImage: rb, stylePrompt: fullPrompt, aspectRatio: '1:1' }),
      });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      setResult(d.imageUrl);
      setAttachJobId('');
      // Save bid render to history
      if (token) {
        try {
          const saved = await fetch('/api/bids', {
            method: 'POST',
            headers: { 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
            body: JSON.stringify({ renderUrl: d.imageUrl, projectType: projType }),
          }).then(r => r.json());
          if (saved.id) {
            setPastBids(prev => [{ id:saved.id, render_url:d.imageUrl, project_type:projType, created_at:new Date().toISOString() }, ...prev]);
          }
        } catch {}
      }
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false); setPhase('');
    }
  };

  const attachToJob = async (jobId) => {
    if (!jobId || !result || !token) return;
    const bid = pastBids[0];
    if (!bid) return;
    await fetch(`/api/bids`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
      body: JSON.stringify({ renderUrl: result, projectType: projType, jobId: parseInt(jobId) }),
    }).catch(() => {});
    setAttachJobId(jobId);
  };

  return (
    <div className="upload-screen fade-in">
      {/* Header */}
      <div style={{marginBottom:24}}>
        <div style={{display:'inline-block',background:'rgba(245,158,11,0.1)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:6,padding:'3px 10px',fontSize:10,fontWeight:800,letterSpacing:1.5,color:'var(--amber)',marginBottom:10}}>BID MODE</div>
        <h1 className="screen-h1" style={{marginBottom:6}}>Win the job before you start it.</h1>
        <p className="screen-sub" style={{marginBottom:10}}>
          Upload a property photo — AI renders a photorealistic finished result. Attach it to your proposal and close more bids.
        </p>
        <div style={{fontSize:12,color:'var(--amber)',fontWeight:600,background:'rgba(245,158,11,0.06)',border:'1px solid rgba(245,158,11,0.18)',borderRadius:8,padding:'8px 12px',lineHeight:1.5}}>
          Contractors using Bid Mode report winning more estimates. One render. One job.
        </div>
      </div>

      {/* Step 1: Upload before photo */}
      <div className="cfg-section">
        <div className="cfg-label">Step 1 — Upload Your Job Site Photo</div>
        <UploadZone label="JOB SITE" image={before} onUpload={url => { setBefore(url); setResult(null); }} />
      </div>

      {/* Step 2: Project type */}
      <div className="cfg-section">
        <div className="cfg-label">Step 2 — Project Type</div>
        <div className="type-grid">
          {PROJECT_TYPES.map(t => (
            <div key={t} className={`type-pill${projType === t ? ' sel' : ''}`}
              onClick={() => handleProjType(t)}>{t}</div>
          ))}
        </div>
      </div>

      {/* Step 3: Style cards */}
      <div className="cfg-section">
        <div className="cfg-label">Step 3 — Choose a Finished Style</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {styles.map(s => {
            const isSel = selStyle?.id === s.id;
            return (
              <div key={s.id} onClick={() => { setSelStyle(s); setResult(null); }}
                style={{
                  padding:'14px 12px',borderRadius:12,cursor:'pointer',
                  background: isSel ? 'rgba(245,158,11,0.08)' : 'var(--s2)',
                  border: isSel ? '1.5px solid var(--amber)' : '1.5px solid var(--border)',
                  boxShadow: isSel ? '0 0 16px rgba(245,158,11,0.15)' : 'none',
                  transition:'all 0.18s',
                }}>
                <div style={{fontSize:22,marginBottom:6}}>{s.emoji}</div>
                <div style={{fontWeight:800,fontSize:13,color: isSel ? 'var(--amber)' : 'var(--text)',marginBottom:2}}>{s.label}</div>
                <div style={{fontSize:11,color:'var(--text-3)'}}>{s.tag}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Optional custom details */}
      {selStyle && (
        <div className="cfg-section">
          <div className="cfg-label">Optional — Add Custom Details</div>
          <textarea
            value={custom}
            onChange={e => setCustom(e.target.value)}
            placeholder={`e.g. "add a black metal roof and cedar garage doors"`}
            style={{width:'100%',background:'var(--s2)',border:'1px solid var(--border)',
              borderRadius:10,padding:'12px 14px',color:'var(--text)',fontSize:13,
              resize:'vertical',minHeight:72,fontFamily:'inherit',boxSizing:'border-box'}}
          />
        </div>
      )}

      {/* Error */}
      {error && (
        <div className="err-box">
          ⚠ {error}
          {isCreditsError(error) && (
            <div style={{marginTop:10}}>
              <a href="https://fal.ai/dashboard" target="_blank" rel="noopener noreferrer"
                style={{display:'inline-block',background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.4)',borderRadius:8,padding:'6px 14px',fontSize:13,color:'var(--red)',textDecoration:'none',fontWeight:600}}>
                → Top Up Credits at fal.ai/dashboard
              </a>
            </div>
          )}
        </div>
      )}

      {/* Generate button */}
      <button className="gen-btn" onClick={generate} disabled={!canGen || loading}
        style={{marginBottom:result ? 8 : 0}}>
        {loading
          ? <span style={{display:'flex',alignItems:'center',gap:10,justifyContent:'center'}}>
              <span style={{display:'inline-block',width:18,height:18,border:'2px solid #000',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.8s linear infinite'}} />
              {phase || 'Generating preview...'}
            </span>
          : canGen ? '✦  Generate Bid Render' : 'Upload a photo and choose a style'}
      </button>

      {/* Result: before/after reveal */}
      {result && (
        <div className="fade-in" style={{marginTop:8}}>
          <div style={{textAlign:'center',marginBottom:12}}>
            <div style={{fontSize:13,fontWeight:700,color:'var(--green)',marginBottom:4}}>✓ Bid Render Ready</div>
            <div style={{fontSize:12,color:'var(--text-3)'}}>Tap the image to toggle Before / After</div>
          </div>

          {/* Before/After toggle image */}
          <div onClick={() => setShowBefore(b => !b)}
            style={{position:'relative',width:'100%',borderRadius:16,overflow:'hidden',
              cursor:'pointer',border:'1px solid var(--border)',aspectRatio:'1/1',background:'#000'}}>
            <img
              src={showBefore ? before : result}
              style={{width:'100%',height:'100%',objectFit:'cover',display:'block',transition:'opacity 0.25s'}}
            />
            <div style={{position:'absolute',top:10,left:10,background:'#000000cc',
              color: showBefore ? 'var(--text-2)' : 'var(--amber)',
              fontSize:11,fontWeight:800,borderRadius:6,padding:'4px 10px',letterSpacing:1}}>
              {showBefore ? 'BEFORE' : 'AFTER'}
            </div>
            <div style={{position:'absolute',bottom:10,right:10,background:'#000000cc',
              color:'var(--text-3)',fontSize:10,borderRadius:6,padding:'3px 8px'}}>
              tap to flip
            </div>
          </div>

          {/* Style label */}
          <div style={{textAlign:'center',marginTop:10,fontSize:12,color:'var(--text-2)'}}>
            <span style={{color:'var(--amber)',fontWeight:700}}>{selStyle?.emoji} {selStyle?.label}</span>
            {custom && <span style={{color:'var(--text-3)'}}> · {custom}</span>}
          </div>

          {/* Action buttons */}
          <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:16}}>
            <button className="btn-amber"
              onClick={() => onUseAsAfter({ before, after: result, projType })}
              style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,fontSize:15,padding:'16px 24px',letterSpacing:0.3}}>
               BuildCast This
            </button>
            <div style={{display:'flex',gap:10}}>
              <button
                onClick={async () => {
                  try {
                    const r = await fetch(result);
                    const blob = await r.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = `buildcast_bid_${Date.now()}.jpg`;
                    a.click(); URL.revokeObjectURL(url);
                  } catch(e) { window.open(result, '_blank'); }
                }}
                style={{flex:1,padding:'13px',background:'var(--s2)',border:'1px solid var(--border)',
                  borderRadius:50,color:'var(--text-2)',fontSize:13,fontWeight:700,cursor:'pointer'}}>
                ↓ Download for Proposal
              </button>
              <button
                onClick={() => { setResult(null); setShowBefore(false); }}
                style={{flex:1,padding:'13px',background:'var(--s2)',border:'1px solid var(--border)',
                  borderRadius:50,color:'var(--text-2)',fontSize:13,fontWeight:700,cursor:'pointer'}}>
                ↺ Try Another Style
              </button>
            </div>

            {/* Attach to Job */}
            {token && jobs && jobs.length > 0 && (
              <div style={{marginTop:12,background:'var(--s2)',border:'1px solid var(--border)',borderRadius:12,padding:'14px 16px'}}>
                <div style={{fontSize:12,fontWeight:700,color:'var(--text-2)',marginBottom:8,letterSpacing:0.5}}>ATTACH TO JOB</div>
                <div style={{display:'flex',gap:10,alignItems:'center'}}>
                  <select
                    value={attachJobId}
                    onChange={e => setAttachJobId(e.target.value)}
                    style={{flex:1,background:'var(--s1)',border:'1px solid var(--border)',borderRadius:8,
                      padding:'9px 12px',color:'var(--text)',fontSize:13,fontFamily:'inherit'}}>
                    <option value="">Select a job...</option>
                    {jobs.map(j => <option key={j.id} value={j.id}>{j.job_name}{j.client_name ? ` — ${j.client_name}` : ''}</option>)}
                  </select>
                  <button
                    onClick={() => attachToJob(attachJobId)}
                    disabled={!attachJobId}
                    style={{padding:'9px 18px',borderRadius:8,background: attachJobId ? 'var(--amber)' : 'var(--s3)',
                      border:'none',color: attachJobId ? '#000' : 'var(--text-3)',fontSize:13,fontWeight:700,cursor: attachJobId ? 'pointer' : 'default'}}>
                    Attach
                  </button>
                </div>
                {attachJobId && (
                  <div style={{fontSize:11,color:'var(--green)',marginTop:6,fontWeight:600}}>✓ Bid render attached to job</div>
                )}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Past Bids */}
      {token && pastBids.length > 0 && (
        <div style={{marginTop:32}}>
          <div style={{fontSize:11,fontWeight:800,color:'var(--text-3)',letterSpacing:1.5,marginBottom:14}}>PAST BIDS</div>
          <div className="bid-hist-grid">
            {pastBids.map(bid => (
              <div key={bid.id} className="bid-card">
                <div className="bid-thumb-row">
                  <img src={bid.render_url} className="bid-thumb" style={{width:'100%',borderRadius:10,aspectRatio:'1/1',objectFit:'cover',display:'block'}} />
                </div>
                <div className="bid-card-info">
                  <div style={{fontSize:12,fontWeight:700,color:'var(--text)',marginBottom:2}}>{bid.project_type || 'Project'}</div>
                  <div style={{fontSize:11,color:'var(--text-3)'}}>{new Date(bid.created_at).toLocaleDateString()}</div>
                </div>
                <button className="bid-redown"
                  onClick={() => window.open(bid.render_url, '_blank')}
                  style={{width:'100%',marginTop:8,padding:'8px',background:'var(--s2)',border:'1px solid var(--border)',
                    borderRadius:8,color:'var(--text-2)',fontSize:12,fontWeight:700,cursor:'pointer'}}>
                  ↓ Re-Download
                </button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── PhotoFixerModal ────────────────────────────────────── */
function PhotoFixerModal({ dataUrl, aspectRatio, label, projType, onApply, onClose }) {
  const canvasRef  = useRef(null);
  const imgRef     = useRef(null);
  const [tab,         setTab]         = useState('fix');
  // Fix tab state
  const [rotation,    setRotation]    = useState(0);
  const [flipH,       setFlipH]       = useState(false);
  const [zoom,        setZoom]        = useState(1.0);
  const [brightness,  setBrightness]  = useState(100);
  const [offsetX,     setOffsetX]     = useState(0);
  const [offsetY,     setOffsetY]     = useState(0);
  // Generate tab state
  const [genProjType, setGenProjType] = useState(projType || 'Residential Build');
  const [customPrompt,setCustomPrompt]= useState('');
  const [generating,  setGenerating]  = useState(false);
  const [genStatus,   setGenStatus]   = useState('');
  const [genResult,   setGenResult]   = useState(null); // url of generated image

  useEffect(() => {
    const img = new Image();
    img.onload = () => { imgRef.current = img; redraw(); };
    img.src = dataUrl;
  }, [dataUrl]);

  useEffect(() => { if (imgRef.current && tab === 'fix') redraw(); }, [rotation, flipH, zoom, brightness, offsetX, offsetY, tab]);

  function redraw() {
    const img = imgRef.current;
    if (!img || !canvasRef.current) return;
    const canvas = canvasRef.current;
    const cw = 480;
    const ch = Math.round(cw / (aspectRatio === '16:9' ? 16/9 : aspectRatio === '9:16' ? 9/16 : 1));
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#080909'; ctx.fillRect(0, 0, cw, ch);
    const rad = (rotation * Math.PI) / 180;
    const swapped = rotation === 90 || rotation === 270;
    const srcW = swapped ? img.naturalHeight : img.naturalWidth;
    const srcH = swapped ? img.naturalWidth  : img.naturalHeight;
    const base = Math.min(cw / srcW, ch / srcH);
    ctx.save();
    ctx.translate(cw/2 + offsetX, ch/2 + offsetY);
    if (flipH) ctx.scale(-1, 1);
    ctx.rotate(rad);
    ctx.filter = `brightness(${brightness}%)`;
    ctx.drawImage(img, -img.naturalWidth/2*zoom*base*(swapped?img.naturalHeight/img.naturalWidth:1),
      -img.naturalHeight/2*zoom*base*(swapped?img.naturalWidth/img.naturalHeight:1),
      img.naturalWidth*zoom*base*(swapped?img.naturalHeight/img.naturalWidth:1),
      img.naturalHeight*zoom*base*(swapped?img.naturalWidth/img.naturalHeight:1));
    ctx.restore(); ctx.filter = 'none';
    ctx.strokeStyle = 'rgba(245,158,11,0.45)'; ctx.lineWidth = 1;
    ctx.setLineDash([6,4]); ctx.strokeRect(14,14,cw-28,ch-28); ctx.setLineDash([]);
  }

  function rotate(dir) { setRotation(r=>(r+dir+360)%360); setOffsetX(0); setOffsetY(0); }

  function applyFix() {
    const img = imgRef.current; if (!img) return;
    const canvas = document.createElement('canvas');
    const targetAR = aspectRatio === '16:9' ? 16/9 : aspectRatio === '9:16' ? 9/16 : 1;
    const outW = 1080, outH = Math.round(outW / targetAR);
    canvas.width = outW; canvas.height = outH;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#080909'; ctx.fillRect(0,0,outW,outH);
    const rad = (rotation * Math.PI) / 180;
    const swapped = rotation === 90 || rotation === 270;
    const srcW = swapped ? img.naturalHeight : img.naturalWidth;
    const srcH = swapped ? img.naturalWidth  : img.naturalHeight;
    const base = Math.min(outW/srcW, outH/srcH);
    const sx = offsetX*(outW/480), sy = offsetY*(outH/Math.round(480/(aspectRatio==='16:9'?16/9:aspectRatio==='9:16'?9/16:1)));
    ctx.save();
    ctx.translate(outW/2+sx, outH/2+sy);
    if (flipH) ctx.scale(-1,1);
    ctx.rotate(rad);
    ctx.filter = `brightness(${brightness}%)`;
    ctx.drawImage(img, -img.naturalWidth/2*zoom*base*(swapped?img.naturalHeight/img.naturalWidth:1),
      -img.naturalHeight/2*zoom*base*(swapped?img.naturalWidth/img.naturalHeight:1),
      img.naturalWidth*zoom*base*(swapped?img.naturalHeight/img.naturalWidth:1),
      img.naturalHeight*zoom*base*(swapped?img.naturalWidth/img.naturalHeight:1));
    ctx.restore(); ctx.filter = 'none';
    onApply(canvas.toDataURL('image/jpeg', 0.92));
  }

  async function generatePhoto() {
    setGenerating(true); setGenResult(null); setGenStatus('Submitting to FLUX AI...');
    try {
      const r = await fetch('/api/generate-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          projectType: genProjType,
          slot:        label.toLowerCase(),
          aspectRatio,
          customPrompt: customPrompt.trim() || null,
        }),
      });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      setGenResult(d.imageUrl);
      setGenStatus('');
    } catch(e) {
      setGenStatus('Error: ' + e.message);
    }
    setGenerating(false);
  }

  return (
    <div className="fixer-overlay">
      <div className="fixer-header">
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span className="fixer-title">{tab === 'fix' ? 'Fix Photo' : 'Generate Photo'}</span>
          <span className="fixer-badge">{label}</span>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <div style={{display:'flex',background:'var(--s3)',borderRadius:8,padding:3,gap:3}}>
            <button onClick={()=>setTab('fix')}
              style={{padding:'7px 16px',borderRadius:6,border:'none',cursor:'pointer',fontSize:12,fontWeight:700,
                background:tab==='fix'?'var(--amber)':'transparent',color:tab==='fix'?'#000':'var(--text-2)'}}>
               Fix
            </button>
            <button onClick={()=>setTab('generate')}
              style={{padding:'7px 16px',borderRadius:6,border:'none',cursor:'pointer',fontSize:12,fontWeight:700,
                background:tab==='generate'?'var(--amber)':'transparent',color:tab==='generate'?'#000':'var(--text-2)'}}>
               Generate New
            </button>
          </div>
          <button className="fixer-btn" onClick={onClose}>Cancel</button>
        </div>
      </div>

      {tab === 'fix' ? (
        <>
          <div className="fixer-canvas-wrap">
            <canvas ref={canvasRef} style={{borderRadius:12,border:'1px solid var(--border)'}} />
          </div>
          <div className="fixer-toolbar">
            <div className="fixer-tools-row">
              <button className="fixer-btn" onClick={()=>rotate(-90)}>↺ Rotate Left</button>
              <button className="fixer-btn" onClick={()=>rotate(90)}>↻ Rotate Right</button>
              <button className="fixer-btn" onClick={()=>setFlipH(f=>!f)}>↔ Flip</button>
              <button className="fixer-btn" onClick={()=>setZoom(z=>Math.max(0.4,+(z-0.15).toFixed(2)))}>− Zoom Out</button>
              <button className="fixer-btn" onClick={()=>setZoom(z=>Math.min(2.5,+(z+0.15).toFixed(2)))}>+ Zoom In</button>
              <button className="fixer-btn" onClick={()=>setOffsetX(x=>x-20)}>← Shift</button>
              <button className="fixer-btn" onClick={()=>setOffsetX(x=>x+20)}>→ Shift</button>
              <button className="fixer-btn" onClick={()=>setOffsetY(y=>y-20)}>↑ Shift</button>
              <button className="fixer-btn" onClick={()=>setOffsetY(y=>y+20)}>↓ Shift</button>
              <button className="fixer-btn" onClick={()=>{setRotation(0);setFlipH(false);setZoom(1);setBrightness(100);setOffsetX(0);setOffsetY(0);}}>↺ Reset</button>
            </div>
            <div className="fixer-brightness">
              <label>BRIGHTNESS</label>
              <input type="range" min="50" max="160" value={brightness} onChange={e=>setBrightness(parseInt(e.target.value))} />
              <span style={{fontSize:12,color:'var(--text-2)',minWidth:36}}>{brightness}%</span>
            </div>
            <div className="fixer-actions">
              <button className="btn-amber" style={{padding:'14px 40px',borderRadius:'50px',fontSize:15,fontWeight:800,cursor:'pointer',border:'none'}} onClick={applyFix}>
                ✓ Apply Fix
              </button>
              <button className="fixer-btn" style={{padding:'14px 20px'}} onClick={()=>setTab('generate')}>
                Photo beyond fixing? → Generate New
              </button>
            </div>
          </div>
        </>
      ) : (
        <div style={{flex:1,overflowY:'auto',padding:'28px 32px',display:'flex',flexDirection:'column',gap:24}}>

          {/* Project type picker */}
          <div>
            <div className="cfg-label" style={{marginBottom:10}}>Project Type</div>
            <div className="type-grid">
              {PROJECT_TYPES.map(t => (
                <div key={t} className={`type-pill${genProjType===t?' sel':''}`} onClick={()=>setGenProjType(t)}>{t}</div>
              ))}
            </div>
          </div>

          {/* Frame context */}
          <div style={{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:12,padding:'16px 20px',fontSize:13,color:'var(--text-2)',lineHeight:1.6}}>
            <strong style={{color:'var(--amber)'}}>Generating: </strong>
            {label === 'BEFORE'
              ? `A realistic ${genProjType.toLowerCase()} site at the START of the project — empty lot, site prep, workers beginning work.`
              : `A realistic ${genProjType.toLowerCase()} project that is FULLY COMPLETED — finished structure, polished result.`
            }
          </div>

          {/* Optional custom description */}
          <div>
            <div className="cfg-label" style={{marginBottom:8}}>Add Details <span style={{color:'var(--text-3)',fontWeight:400,letterSpacing:0}}>(optional)</span></div>
            <textarea
              value={customPrompt}
              onChange={e=>setCustomPrompt(e.target.value)}
              placeholder={`e.g. "brick exterior, two-car garage, suburban street" or "rooftop commercial unit, city background"`}
              style={{width:'100%',background:'var(--s2)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 14px',
                color:'var(--text)',fontSize:13,lineHeight:1.6,resize:'vertical',minHeight:72,fontFamily:'Inter,sans-serif'}}
            />
          </div>

          {/* Generated preview */}
          {genResult && (
            <div style={{textAlign:'center'}}>
              <img src={genResult} alt="Generated" style={{maxWidth:'100%',maxHeight:360,borderRadius:12,border:'1px solid var(--border)'}} />
            </div>
          )}

          {genStatus && (
            <div style={{textAlign:'center',fontSize:13,color:genStatus.startsWith('Error')?'var(--red)':'var(--amber)',
              display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              {!genStatus.startsWith('Error') && <span style={{animation:'spin 1s linear infinite',display:'inline-block'}}>⟳</span>}
              {genStatus}
            </div>
          )}

          <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
            <button
              onClick={generatePhoto}
              disabled={generating}
              className="btn-amber"
              style={{padding:'14px 36px',borderRadius:'50px',fontSize:15,fontWeight:800,cursor:'pointer',border:'none',opacity:generating?0.6:1}}>
              {generating ? '⟳  Generating...' : genResult ? ' Generate Again' : ' Generate Photo'}
            </button>
            {genResult && (
              <button
                onClick={()=>onApply(genResult)}
                style={{padding:'14px 36px',borderRadius:'50px',fontSize:15,fontWeight:800,cursor:'pointer',
                  border:'1px solid var(--amber)',background:'transparent',color:'var(--amber)'}}>

  );

function UploadScreen({ onGenerate, onPreview, error, pendingBefore, onClearPendingBefore, pendingAfter, onClearPendingAfter, pendingProjType, onClearPendingProjType, isPro, isStudio, onUpgrade }) {
  const [before,      setBefore]      = useState(null);
  const [after,       setAfter]       = useState(null);
  const [projType,    setProjType]    = useState('Residential New Construction');
  const [fromPreview, setFromPreview] = useState(false);
  const [fmt,      setFmt]      = useState(FORMATS[0]);
  const [dur,      setDur]      = useState(DURATIONS[0]);
  const [showGuide,  setShowGuide]  = useState(false);
