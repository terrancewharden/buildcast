    if (pendingBefore)   { setBefore(pendingBefore);     onClearPendingBefore();   arrived = true; }
    if (pendingAfter)    { setAfter(pendingAfter);        onClearPendingAfter();    arrived = true; }
    if (pendingProjType) { setProjType(pendingProjType);  onClearPendingProjType(); }
    if (arrived) setFromPreview(true);
  }, [pendingBefore, pendingAfter, pendingProjType]);

  const is30   = dur.id === '30';
  const canGen = before && after;

  const handleGenerate = async () => {
    if (!canGen) return;
    const [rb, ra] = await Promise.all([
      resizeImage(before, 1024),
      resizeImage(after,  1024),
    ]);
    const mid = (is30 && midOverride) ? await resizeImage(midOverride, 1024) : null;
    onGenerate(rb, ra, projType, fmt.aspect, fmt, dur.id, mid);
  };

  return (
    <div className="upload-screen fade-in">
      {showGuide && <ShotGuideModal fmt={fmt} onClose={() => setShowGuide(false)} />}
      {fixer && (
        <PhotoFixerModal
          dataUrl={fixer.slot === 'before' ? before : after}
          aspectRatio={fmt.aspect}
          label={fixer.slot === 'before' ? 'BEFORE' : 'AFTER'}
          projType={projType}
          onApply={url => { fixer.slot === 'before' ? setBefore(url) : setAfter(url); setFixer(null); }}
          onClose={() => setFixer(null)}
        />
      )}

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <div>
          <h1 className="screen-h1" style={{marginBottom:4}}>Upload Your Photos</h1>
          <p className="screen-sub" style={{marginBottom:0}}>Before and after — that&apos;s all you need.</p>
        </div>
        <button
          onClick={() => setShowGuide(true)}
          style={{flexShrink:0,padding:'10px 18px',background:'var(--s2)',border:'1px solid var(--border)',borderRadius:'10px',color:'var(--amber)',fontWeight:700,fontSize:13,cursor:'pointer',display:'flex',alignItems:'center',gap:8}}
        >
           Shot Guide
        </button>
      </div>

      {/* Banner: arrived from AI Preview */}
      {fromPreview && (
        <div style={{
          background:'rgba(245,158,11,0.08)',border:'1px solid rgba(245,158,11,0.3)',
          borderRadius:12,padding:'12px 16px',marginBottom:20,
          display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,
        }}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:22}}></span>
            <div>
              <div style={{fontWeight:800,fontSize:13,color:'var(--amber)',marginBottom:2}}>AI Preview loaded</div>
              <div style={{fontSize:12,color:'var(--text-2)'}}>Both photos are pre-filled from your Project Preview. Pick a format, hit Generate.</div>
            </div>
          </div>
          <button onClick={() => setFromPreview(false)}
            style={{background:'none',border:'none',color:'var(--text-3)',fontSize:18,cursor:'pointer',lineHeight:1,flexShrink:0}}>✕</button>
        </div>
      )}

      <div style={{background:'var(--s1)',border:'1px solid rgba(245,158,11,0.3)',borderRadius:16,padding:'20px',marginTop:24,marginBottom:20}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:18}}>
          <div className="cfg-step-num">1</div>
          <div style={{fontSize:12,fontWeight:900,letterSpacing:1.8,color:'var(--amber)',textTransform:'uppercase'}}>Upload Before &amp; After Photos</div>
        </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
        <div>
          <UploadZone label="BEFORE" image={before} onUpload={setBefore} />
          {before && (
            <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:8}}>
              <button onClick={() => isPro ? onPreview(before) : onUpgrade('preview')}
                style={{width:'100%',padding:'9px',background:'rgba(245,158,11,0.08)',
                  border:'1px solid rgba(245,158,11,0.3)',borderRadius:8,
                  color:'var(--amber)',fontSize:12,fontWeight:800,cursor:'pointer'}}>
                {isPro ? ' Preview Finished Look' : ' Preview Finished Look · Pro'}
              </button>
              <button onClick={() => setFixer({slot:'before'})}
                style={{width:'100%',padding:'9px',background:'var(--s2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text-2)',fontSize:12,fontWeight:700,cursor:'pointer'}}>
                 Fix This Photo
              </button>
            </div>
          )}
        </div>
        <div>
          <UploadZone label="AFTER" image={after} onUpload={setAfter} />
          {after && (
            <button onClick={() => setFixer({slot:'after'})}
              style={{width:'100%',marginTop:8,padding:'9px',background:'var(--s2)',border:'1px solid var(--border)',borderRadius:8,color:'var(--text-2)',fontSize:12,fontWeight:700,cursor:'pointer'}}>
               Fix This Photo
            </button>
          )}
        </div>
      </div>
      </div>

      <div className="cfg-section">
        <div className="cfg-label"><span className="cfg-step-num">2</span>Project Type</div>
        <div className="type-grid">
          {PROJECT_TYPES.map(t => (
            <div key={t} className={`type-pill${projType === t ? ' sel' : ''}`} onClick={() => setProjType(t)}>{t}</div>
          ))}
        </div>
      </div>

      <div className="cfg-section">
        <div className="cfg-label"><span className="cfg-step-num">3</span>Video Format</div>
        <div className="fmt-row">
          {FORMATS.map(f => (
            <div key={f.id} className={`fmt-btn${fmt.id === f.id ? ' sel' : ''}`} onClick={() => setFmt(f)}>
              <span className="fmt-icon">{f.icon}</span>
              {f.label}
            </div>
          ))}
        </div>
      </div>

      <div className="cfg-section">
        <div className="cfg-label"><span className="cfg-step-num">4</span>Video Length</div>
        <div className="fmt-row">
          {DURATIONS.map(d => {
            const locked = d.id === '30' && !isStudio;
            return (
            <div key={d.id}
              className={`fmt-btn dur-btn${dur.id === d.id ? ' sel' : ''}`}
              onClick={() => locked ? onUpgrade('30s') : setDur(d)}
              style={locked ? {opacity:0.6,position:'relative'} : {}}>
              <span className="fmt-icon">{locked ? '' : d.icon}</span>
              <span style={{display:'block',fontWeight:700}}>{d.label}</span>
              <span style={{display:'block',fontSize:'10px',marginTop:'3px',opacity:0.7}}>
                {locked ? 'Studio only' : d.note}
              </span>
            </div>
            );
          })}
        </div>
      </div>

      {/* ── 30-sec: AI auto-midpoint notice + optional override ── */}
      {is30 && (
        <div style={{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:12,
          padding:'14px 16px',display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:20}}></span>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>AI auto-generates the midpoint</div>
              <div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>Upload before &amp; after — we handle everything else.</div>
            </div>
          </div>

          {/* Optional override */}
          {!showMidOpt ? (
            <button onClick={() => setShowMidOpt(true)}
              style={{alignSelf:'flex-start',background:'none',border:'none',
                color:'var(--text-3)',fontSize:11,cursor:'pointer',padding:0,textDecoration:'underline'}}>
              Have a progress photo? Use it instead (optional)
            </button>
          ) : (
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              {midOverride ? (
                <>
                  <img src={midOverride} style={{width:56,height:56,objectFit:'cover',borderRadius:8,
                    border:'1px solid var(--amber)',flexShrink:0}} />
                  <div style={{fontSize:12,color:'var(--text-2)'}}>
                    <div style={{fontWeight:700,color:'var(--amber)'}}>Progress photo set ✓</div>
                    <button onClick={() => { setMidOverride(null); setShowMidOpt(false); }}
                      style={{background:'none',border:'none',color:'var(--text-3)',fontSize:11,
                        cursor:'pointer',padding:0,marginTop:3,textDecoration:'underline'}}>
                      Remove — use AI instead
                    </button>
                  </div>
                </>
              ) : (
                <label style={{cursor:'pointer',display:'flex',alignItems:'center',gap:8,
                  padding:'9px 14px',background:'var(--s1)',border:'1px solid var(--border)',
                  borderRadius:8,fontSize:12,color:'var(--text-2)'}}>
                  <input type="file" accept="image/*" style={{display:'none'}}
                    onChange={e => {
                      const f = e.target.files[0];
                      if (!f) return;
                      const r = new FileReader();
                      r.onload = ev => setMidOverride(ev.target.result);
                      r.readAsDataURL(f);
                    }} />
                   Upload progress photo
                </label>
              )}
            </div>
          )}
        </div>
      )}

      {error && (
        <div className="err-box" style={{marginBottom:'20px'}}>
          ⚠ {error}
          {isCreditsError(error) && (
            <div style={{marginTop:10}}>
              <a href="https://fal.ai/dashboard" target="_blank" rel="noopener noreferrer"
                style={{display:'inline-block',background:'rgba(239,68,68,0.15)',border:'1px solid rgba(239,68,68,0.4)',borderRadius:8,padding:'6px 14px',fontSize:13,color:'var(--red)',textDecoration:'none',fontWeight:600}}>
                → Top Up Credits at fal.ai/dashboard
              </a>
            </div>
          )}
        </div>
      )}

      <div style={{background:'linear-gradient(135deg,rgba(245,158,11,0.08),rgba(245,158,11,0.03))',
        border:'1.5px solid rgba(245,158,11,0.35)',borderRadius:16,padding:'20px 20px 16px',marginBottom:16}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
          <div className="cfg-step-num">5</div>
          <div style={{fontSize:12,fontWeight:900,letterSpacing:1.8,color:'var(--amber)',textTransform:'uppercase'}}>Generate Your Timelapse</div>
        </div>
        <button className="gen-btn" onClick={handleGenerate} disabled={!canGen}>
          {canGen ? '✦  Generate AI Timelapse' : 'Upload both photos to continue'}
        </button>
      </div>
    </div>
  );
}

  { icon:'', title:'The wait is worth it', body:'Contractors using BuildCast close more deals — clients respond immediately when they see the transformation, not just static photos.' },

function RetentionCards() {
  const [idx, setIdx] = useState(0);

    const t = setInterval(() => setIdx(i => (i + 1) % RETENTION_MSGS.length), 5000);
    return () => clearInterval(t);

  const card = RETENTION_MSGS[idx];
  return (
    <div style={{width:'100%',display:'flex',flexDirection:'column',gap:10}}>
      <div key={idx} style={{background:'var(--s2)',border:'1px solid var(--border)',borderRadius:16,

      </div>
      <div style={{display:'flex',gap:5,justifyContent:'center'}}>
        {RETENTION_MSGS.map((_,i) => (
          <div key={i} onClick={() => setIdx(i)} style={{
            height:5,borderRadius:3,cursor:'pointer',transition:'all 0.3s',
            width: i === idx ? 18 : 5,
            background: i === idx ? 'var(--amber)' : 'var(--s4)',
          }} />
        ))}
      </div>
    </div>
  );
}

/* ─── ResultScreen ───────────────────────────────────────── */
function ResultScreen({ videoUrl, videoUrl2, fmt, onStartOver, currentUser, userProfile, onAuthSuccess, onOpenWatermark }) {
  const is30     = !!videoUrl2;
  const portrait = fmt.aspect === '9:16';
  const platforms = SOCIAL_PLATFORMS[fmt.aspect] || SOCIAL_PLATFORMS['9:16'];
  const hasWatermark = !!(userProfile?.logo || userProfile?.website || userProfile?.phone);

  // Chained playback state
  const videoRef    = useRef(null);
  const [clipNum,   setClipNum]   = useState(1);
  const [dlLoading, setDlLoading] = useState(null); // null | 1 | 2 | 'social-{id}' | 'wm'
  const [wmProgress, setWmProgress] = useState(0);  // 0-1 progress for watermark render
  const [showAuth,  setShowAuth]  = useState(false);
  const [pendingDl, setPendingDl] = useState(null); // fn to call after auth

  // When clip 1 ends → switch to clip 2, and vice-versa (seamless loop)
  const handleEnded = () => {
    if (!is30) return;
    setClipNum(c => c === 1 ? 2 : 1);
  };

  useEffect(() => {
    if (!is30 || !videoRef.current) return;
    const src = clipNum === 1 ? videoUrl : videoUrl2;
    videoRef.current.src = src;
    videoRef.current.load();
    videoRef.current.play().catch(() => {});
  }, [clipNum]);

  const doDownload = async (url, filename) => {
    try {
      const r    = await fetch(url);
      const blob = await r.blob();
      const burl = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = burl; a.download = filename;
      a.click();
      URL.revokeObjectURL(burl);
    } catch {
      window.open(url, '_blank');
    }
  };

  const downloadWithWatermark = (url) => {
    guardedDownload(async () => {
      setWmProgress(0);
      const wmConfig = { logo: userProfile?.logo||null, website: userProfile?.website||'', phone: userProfile?.phone||'' };
      try {
        const { url: wmUrl, ext } = await applyWatermarkToVideo(url, wmConfig, p => setWmProgress(p));
        const a = document.createElement('a');
        a.href = wmUrl; a.download = `buildcast_branded_${Date.now()}.${ext}`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(wmUrl), 60000);
      } catch(e) {
        console.warn('Watermark failed, falling back to plain download:', e);
        await doDownload(url, `buildcast_timelapse_${Date.now()}.mp4`);
      }
    }, 'wm');
  };

  const guardedDownload = (fn, loadingKey) => {
    if (!currentUser) {
      setPendingDl(() => fn);
      setShowAuth(true);
      return;
    }
    setDlLoading(loadingKey);
    fn().finally(() => { setDlLoading(null); setWmProgress(0); });
  };

  const downloadClip = (url, part) => {
    const suffix = is30 ? `_clip${part}` : '';
    guardedDownload(
      () => doDownload(url, `buildcast_timelapse${suffix}_${Date.now()}.mp4`),
      part
    );
  };

  const downloadForPlatform = (platform, url) => {
    guardedDownload(async () => {
      const filename = `buildcast_${platform.id}_${Date.now()}.mp4`;

      // Always open the platform upload page in a new tab
      if (platform.uploadUrl) window.open(platform.uploadUrl, '_blank');

      // Mobile: try Web Share API first — triggers native share sheet
      // so user can pick the app directly (TikTok, Instagram, etc.)
      if (navigator.canShare) {
        try {
          const r    = await fetch(url);
          const blob = await r.blob();
          const file = new File([blob], filename, { type: 'video/mp4' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'My BuildCast Video',
              text:  'Check out this project video I made with BuildCast!',
            });
            return; // shared via native sheet — no need to also download
          }
        } catch (err) {
          // User cancelled share or share failed — fall through to download
          if (err.name === 'AbortError') return;
          console.warn('Web Share failed, falling back to download:', err);
        }
      }

      // Desktop fallback (or if share failed): download the file
      await doDownload(url, filename);
    }, `social-${platform.id}`);
  };

  const handleAuthSuccess = (user) => {
    setShowAuth(false);
    onAuthSuccess(user);
    if (pendingDl) {
      setDlLoading('pending');
      pendingDl().finally(() => setDlLoading(null));
      setPendingDl(null);
    }
  };

  return (
    <div className="result-screen fade-in">
      {showAuth && (
        <AuthModal
          onSuccess={handleAuthSuccess}
          onClose={() => { setShowAuth(false); setPendingDl(null); }}
        />
      )}

      <div className="result-badge bounce-in">✓ &nbsp;Your timelapse is ready</div>
      <h1 className="result-h1 fade-up">TRANSFORMATION<br />COMPLETE</h1>

      <div className={`video-container${portrait ? ' portrait' : ''} fade-up-1`}>
        {is30 ? (
          <>
            <video ref={videoRef} src={videoUrl} onEnded={handleEnded} autoPlay playsInline
              style={{width:'100%',height:'100%',objectFit:'contain'}} />
            <div style={{position:'absolute',bottom:8,right:10,background:'#000000aa',
              color:'var(--amber)',fontSize:11,fontWeight:800,borderRadius:6,padding:'3px 9px',
              letterSpacing:1,pointerEvents:'none'}}>
              CLIP {clipNum} / 2
            </div>
          </>
        ) : (
          <video src={videoUrl} controls autoPlay loop playsInline />
        )}
      </div>

      {is30 && (
        <div style={{textAlign:'center',fontSize:12,color:'var(--text-2)',marginTop:10,marginBottom:4}}>
           Playing clip {clipNum} of 2 — loops automatically
        </div>
      )}

      <div className="result-actions fade-up-2">
        {is30 ? (
          <>
            <button className="btn-amber" onClick={() => downloadClip(videoUrl, 1)}
              disabled={dlLoading !== null}>
              {dlLoading === 1 ? '⟳ Downloading...' : '↓  Download Clip 1 (0–15s)'}
            </button>
            <button className="btn-amber" onClick={() => downloadClip(videoUrl2, 2)}
              disabled={dlLoading !== null}
              style={{background:'transparent',border:'1px solid var(--amber)',color:'var(--amber)'}}>
              {dlLoading === 2 ? '⟳ Downloading...' : '↓  Download Clip 2 (15–30s)'}
            </button>
          </>
        ) : (
          <button className="btn-amber" onClick={() => downloadClip(videoUrl, 1)}
            disabled={dlLoading !== null}>
            {dlLoading === 1 || dlLoading === 'pending' ? '⟳ Downloading...' : '↓  Download Video'}
          </button>
        )}
        <button className="btn-ghost" onClick={onStartOver}>← Create Another</button>
      </div>

      {/* Branded watermark download */}
      <div className="fade-up-2" style={{width:'100%',maxWidth:500,marginTop:4}}>
        {hasWatermark ? (
          <button
            onClick={() => downloadWithWatermark(videoUrl)}
            disabled={dlLoading !== null}
            style={{
              width:'100%',padding:'13px 20px',
              background:'var(--s2)',border:'1.5px solid rgba(245,158,11,0.35)',
              borderRadius:50,color:'var(--amber)',fontSize:13,fontWeight:800,
              cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8,
              transition:'all 0.2s',opacity: dlLoading !== null ? 0.5 : 1,
            }}
          >
            {dlLoading === 'wm'
              ? <>
                  <span style={{display:'inline-block',width:14,height:14,border:'2px solid var(--amber)',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.8s linear infinite'}} />
                  Applying watermark... {wmProgress > 0 ? `${Math.round(wmProgress*100)}%` : ''}
                </>
              : <><span></span> Download with Brand Watermark</>
            }
          </button>
        ) : currentUser ? (
          /* Prompt to set up watermark if not configured */
          <div style={{
            textAlign:'center',padding:'10px 14px',
            background:'rgba(245,158,11,0.04)',border:'1px dashed rgba(245,158,11,0.2)',
            borderRadius:12,fontSize:12,color:'var(--text-3)',
          }}>
             <span style={{color:'var(--text-2)'}}>Add your logo to watermark videos</span>
            {' — '}
            <button
              onClick={onOpenWatermark}
              style={{background:'none',border:'none',color:'var(--amber)',fontSize:12,fontWeight:700,cursor:'pointer',padding:0}}>
              Set up watermark ↗
            </button>
          </div>
        ) : null}
      </div>

      {/* Social platform download buttons */}
      <div className="fade-up-2" style={{width:'100%',maxWidth:500,marginTop:8}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:1,color:'var(--text-3)',marginBottom:10,textAlign:'center'}}>
          SHARE TO SOCIAL MEDIA
        </div>
        <div className="social-row">
          {platforms.map(p => (
            <button key={p.id} className="social-btn"
              disabled={dlLoading !== null}
              onClick={() => downloadForPlatform(p, is30 ? videoUrl : videoUrl)}>
              <span className="social-btn-icon">{p.icon}</span>
              <span style={{fontWeight:800}}>{p.label}</span>
              <span style={{fontSize:10,color:'var(--text-3)',fontWeight:500}}>↓ Download + Open</span>
            </button>
          ))}
        </div>
        <div style={{fontSize:11,color:'var(--text-3)',textAlign:'center',marginTop:10}}>
          Downloads your video then opens {fmt.label} — ready to post
        </div>
      </div>

      <div className="result-note fade-up-3" style={{marginTop:16}}>
        {is30
          ? 'Both clips expire in 24 hours — download both to keep your 30s timelapse.'
          : 'Video link expires in 24 hours — download to keep.'}
      </div>
    </div>
  );
}

/* ─── Notification helpers ───────────────────────────────── */
const PENDING_KEY = 'bc_pending_job';

async function requestBrowserNotify() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  const perm = await Notification.requestPermission();
  return perm === 'granted';
}

function fireDoneNotification(pageUrl) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const n = new Notification(' Your BuildCast video is ready!', {
    body: 'Your construction timelapse finished generating. Click to view and download.',
    tag: 'buildcast-done',
  });
  n.onclick = () => { window.focus(); };
}

/* ─── App ────────────────────────────────────────────────── */
function App() {
  const [screen,       setScreen]      = useState('home');
  const [progress,     setProgress]    = useState(0);
  const [phase,        setPhase]       = useState('');
  const [stepIdx,      setStep]        = useState(0);
  const [videoUrl,     setVideo]       = useState(null);
  const [videoUrl2,    setVideo2]      = useState(null);   // clip 2 for 30s chained
  const [fmt,          setFmt]         = useState(FORMATS[0]);
  const [error,        setError]       = useState('');
  const [previewBefore, setPreviewBefore] = useState(null);
  const [pendingBefore,   setPendingBefore]   = useState(null);
  const [pendingAfter,    setPendingAfter]    = useState(null);
  const [pendingProjType, setPendingProjType] = useState(null);

  // Notification state
  const [notifyGranted,  setNotifyGranted]  = useState(() => 'Notification' in window && Notification.permission === 'granted');
  const [notifyEmail,    setNotifyEmail]    = useState('');

  // Help chat
  const [showHelp, setShowHelp] = useState(false);

  // Auth state
  const [currentUser, setCurrentUser] = useState(() => {
    try {
      const token = localStorage.getItem('bc_token');
      const email = localStorage.getItem('bc_email');
      if (token && email) return { token, email };
    } catch {}
    return null;
  });
  // Watermark / profile state
  const [userProfile,       setUserProfile]       = useState(() => { try { return JSON.parse(localStorage.getItem('bc_profile')||'null'); } catch { return null; } });
  const [showWatermarkModal, setShowWatermarkModal] = useState(false);
  const [showProfileMenu,    setShowProfileMenu]    = useState(false);
  const [showLoginModal,     setShowLoginModal]     = useState(false);
  // New feature state
  const [jobs,             setJobs]            = useState([]);
  const [jobsLoaded,       setJobsLoaded]      = useState(false);
  const [toast,            setToast]           = useState(null);
  const [pubPortfolioSlug, setPubPortfolioSlug] = useState(null);
  const [showSiteMenu,     setShowSiteMenu]    = useState(false);

  const loadUserProfile = async (token) => {
    try {
      const r = await fetch('/api/profile', { headers: { Authorization: `Bearer ${token}` } });
      if (!r.ok) return;
      const d = await r.json();
      setUserProfile(d);
      try { localStorage.setItem('bc_profile', JSON.stringify(d)); } catch {}
    } catch {}
  };

  const handleAuthSuccess = (user, wmProfile) => {
    setCurrentUser(user);
    if (wmProfile) {
      setUserProfile(wmProfile);
      try { localStorage.setItem('bc_profile', JSON.stringify(wmProfile)); } catch {}
    } else {
      loadUserProfile(user.token);
    }
  };
  const handleLogout = () => {
    try {
      localStorage.removeItem('bc_token');
      localStorage.removeItem('bc_email');
      localStorage.removeItem('bc_profile');
    } catch {}
    setCurrentUser(null);
    setUserProfile(null);
  };

  const [usageCount, setUsage] = useState(() => {
    try { return parseInt(localStorage.getItem('bc_usage') || '0', 10); } catch(e) { return 0; }
  });
  // Gating paused — all tiers open. Re-enable by removing `|| true` from both lines.
  const [isPro, setIsPro] = useState(() => {
    try { return localStorage.getItem('bc_pro') === 'true' || true; } catch(e) { return true; }
  });
  const [isStudio, setIsStudio] = useState(() => {
    try { return localStorage.getItem('bc_studio') === 'true' || true; } catch(e) { return true; }
  });

  useEffect(() => {
    const p = new URLSearchParams(window.location.search);
    if (p.get('success') === 'true') {
      const plan = p.get('plan');
      setIsPro(true);
      try { localStorage.setItem('bc_pro', 'true'); } catch(e) {}
      if (plan === 'studio') {
        setIsStudio(true);
        try { localStorage.setItem('bc_studio', 'true'); } catch(e) {}
      }
      window.history.replaceState({}, '', '/');
    }
    if (p.get('canceled') === 'true') window.history.replaceState({}, '', '/');

    // ── Resume pending job if found ──
    try {
      const raw = localStorage.getItem(PENDING_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        const age = Date.now() - (saved.startedAt || 0);
        // Only resume if started less than 20 minutes ago
        if (age < 20 * 60 * 1000) {
          const savedFmt = FORMATS.find(f => f.id === saved.fmtId) || FORMATS[0];
          setFmt(savedFmt);
          setScreen('processing');
          setProgress(saved.lastProgress || 10);
          setPhase('Resuming your video generation...');
          setStep(saved.stepIdx || 1);
          resumeJob(saved);
        } else {
          localStorage.removeItem(PENDING_KEY);
        }
      }
    } catch {}

    // Request notification permission proactively
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().then(perm => setNotifyGranted(perm === 'granted'));
    }

    // Detect /pro/:username public portfolio page
    const pathname = window.location.pathname;
    if (pathname.startsWith('/pro/')) {
      const slug = pathname.slice(5).replace(/\//g, '');
      if (slug) { setPubPortfolioSlug(slug); setScreen('propage'); }
    }
  }, []);

  // Load jobs when user authenticates
  useEffect(() => {
    if (!currentUser?.token || jobsLoaded) return;
    fetch('/api/jobs', { headers: { Authorization: `Bearer ${currentUser.token}` } })
      .then(r => r.json()).then(d => { setJobs(d.jobs || []); setJobsLoaded(true); }).catch(() => {});
  }, [currentUser]);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2400);
  };

  // Resume a job saved in localStorage
  const resumeJob = async (saved) => {
    try {
      if (saved.type === '30s') {
        const { clip1, clip2 } = saved;
        let url1 = null, url2 = null;
        let attempts = 0;
        const max = 250;
        while (attempts < max && (!url1 || !url2)) {
          await sleep(3500); attempts++;
          const [r1, r2] = await Promise.all([
            url1 ? Promise.resolve({status:'completed',videoUrl:url1}) : pollStatus(clip1.statusUrl, clip1.responseUrl),
            url2 ? Promise.resolve({status:'completed',videoUrl:url2}) : pollStatus(clip2.statusUrl, clip2.responseUrl),
          ]);
          if (r1.status === 'failed') throw new Error('Clip 1 failed');
          if (r2.status === 'failed') throw new Error('Clip 2 failed');
          if (r1.status === 'completed' && r1.videoUrl) url1 = r1.videoUrl;
          if (r2.status === 'completed' && r2.videoUrl) url2 = r2.videoUrl;
          const pct = Math.min(93, 20 + (attempts / max) * 72);
          setProgress(pct);
          setPhase(`Generating 30s video — Clip 1 ${url1?'✓':'⟳'} Clip 2 ${url2?'✓':'⟳'}`);
          try { localStorage.setItem(PENDING_KEY, JSON.stringify({...saved, lastProgress:pct, stepIdx:2})); } catch {}
        }
        if (!url1 || !url2) throw new Error('Timed out. Please try again.');
        localStorage.removeItem(PENDING_KEY);
        setProgress(100); setStep(3);
        setVideo(url1); setVideo2(url2); setScreen('result');
        fireDoneNotification(window.location.href);
      } else {
        const { statusUrl, responseUrl } = saved;
        let attempts = 0;
        const max = 200;
        while (attempts < max) {
          await sleep(3500); attempts++;
          const result = await pollStatus(statusUrl, responseUrl);
          if (result.status === 'completed' && result.videoUrl) {
            localStorage.removeItem(PENDING_KEY);
            setProgress(100); setStep(3);
            setVideo(result.videoUrl); setScreen('result');
            fireDoneNotification(window.location.href);
            return;
          }
          if (result.status === 'failed') throw new Error('AI generation failed. Please try again.');
          const pct = Math.min(93, 18 + (attempts / max) * 74);
          setProgress(pct);
          setPhase(`Still generating — AI is working hard on your video (${Math.round(attempts*3.5)}s)`);
          try { localStorage.setItem(PENDING_KEY, JSON.stringify({...saved, lastProgress:pct, stepIdx:2})); } catch {}
        }
        throw new Error('Timed out. The job may still be running — try refreshing.');
      }
    } catch(e) {
      localStorage.removeItem(PENDING_KEY);
      setError(e.message);
      setScreen('upload');
    }
  };

  const handleGenerate = async (before, after, projType, aspect, format, duration, mid) => {
    if (!isPro && usageCount >= FREE_LIMIT) {
      setError(`You've used all ${FREE_LIMIT} free timelapses. Upgrade to continue.`);
      setScreen('upload');
      return;
    }
    setFmt(format);
    setVideo(null);
    setVideo2(null);
    setScreen('processing');
    setProgress(0); setPhase('Analyzing your photos...'); setStep(0); setError('');

    // Request notification permission when they start a generation
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().then(perm => setNotifyGranted(perm === 'granted'));
    }

    try {
      await sleep(700);
      setProgress(10); setPhase('Connecting to AI...'); setStep(1);

      /* ── 30-second chained generation ── */
      if (duration === '30') {
        setPhase(mid ? 'Using your progress photo as midpoint...' : 'AI is generating the midpoint frame...');
        const { clip1, clip2 } = await startGeneration30s(before, mid, after, projType, aspect);
        setProgress(20); setPhase('Generating Clip 1 ⟳ / Clip 2 ⟳ simultaneously...'); setStep(2);
        // Save job so user can close tab and return
        try { localStorage.setItem(PENDING_KEY, JSON.stringify({ type:'30s', clip1, clip2, fmtId:format.id, startedAt:Date.now(), lastProgress:20, stepIdx:2 })); } catch {}

        let url1 = null, url2 = null;
        let attempts = 0;
        const max = 250; // ~14.5 min
        while (attempts < max && (!url1 || !url2)) {
          await sleep(3500);
          attempts++;

          const [r1, r2] = await Promise.all([
            url1 ? Promise.resolve({ status: 'completed', videoUrl: url1 })
                 : pollStatus(clip1.statusUrl, clip1.responseUrl),
            url2 ? Promise.resolve({ status: 'completed', videoUrl: url2 })
                 : pollStatus(clip2.statusUrl, clip2.responseUrl),
          ]);

          if (r1.status === 'failed') throw new Error(`Clip 1 failed: ${r1.error || 'AI generation error'}`);
          if (r2.status === 'failed') throw new Error(`Clip 2 failed: ${r2.error || 'AI generation error'}`);

          if (r1.status === 'completed' && r1.videoUrl) url1 = r1.videoUrl;
          if (r2.status === 'completed' && r2.videoUrl) url2 = r2.videoUrl;

          const elapsed  = Math.round(attempts * 3.5);
          const pct      = Math.min(93, 20 + (attempts / max) * 72);
          const c1label  = url1 ? '✓' : '⟳';
          const c2label  = url2 ? '✓' : '⟳';
          setProgress(pct);
          setPhase(`Generating 30s video — Clip 1 ${c1label} Clip 2 ${c2label} · ${elapsed}s elapsed`);
          try { localStorage.setItem(PENDING_KEY, JSON.stringify({ type:'30s', clip1, clip2, fmtId:format.id, startedAt:Date.now(), lastProgress:pct, stepIdx:2 })); } catch {}
        }

        if (!url1 || !url2) throw new Error('30s generation timed out. Try again or use a shorter duration.');

        localStorage.removeItem(PENDING_KEY);
        setProgress(96); setPhase('Finalizing your 30s timelapse...'); setStep(3);
        await sleep(700);
        setProgress(100);

        const newCount = usageCount + 1;
        setUsage(newCount);
        try { localStorage.setItem('bc_usage', String(newCount)); } catch(e) {}

        setVideo(url1);
        setVideo2(url2);
        setScreen('result');
        // Auto-save to portfolio
        if (currentUser?.token) {
          try {
            await fetch('/api/videos', {
              method:'POST',
              headers:{'Content-Type':'application/json',Authorization:`Bearer ${currentUser.token}`},
              body: JSON.stringify({ videoUrl: url1, projectType: projType }),
            });
            showToast('Saved to Portfolio ✓');
          } catch {}
        }
        fireDoneNotification(window.location.href);
        return;
      }

      /* ── Standard single-clip generation ── */
      const { requestId, statusUrl, responseUrl } = await startGeneration(before, after, projType, aspect, duration);

      setProgress(18); setPhase('AI is generating your transformation...'); setStep(2);
      // Save job so user can close tab and return
      try { localStorage.setItem(PENDING_KEY, JSON.stringify({ type:'standard', statusUrl, responseUrl, fmtId:format.id, startedAt:Date.now(), lastProgress:18, stepIdx:2 })); } catch {}

      let attempts = 0;
      const max = 200; // ~11.5 min
      while (attempts < max) {
        await sleep(3500);
        attempts++;

        const result = await pollStatus(statusUrl, responseUrl);

        if (result.status === 'completed' && result.videoUrl) {
          localStorage.removeItem(PENDING_KEY);
          setProgress(96); setPhase('Finalizing...'); setStep(3);
          await sleep(700);
          setProgress(100);

          const newCount = usageCount + 1;
          setUsage(newCount);
          try { localStorage.setItem('bc_usage', String(newCount)); } catch(e) {}

          setVideo(result.videoUrl);
          setScreen('result');
          // Auto-save to portfolio
          if (currentUser?.token) {
            try {
              await fetch('/api/videos', {
                method:'POST',
                headers:{'Content-Type':'application/json',Authorization:`Bearer ${currentUser.token}`},
                body: JSON.stringify({ videoUrl: result.videoUrl, projectType: projType }),
              });
              showToast('Saved to Portfolio ✓');
            } catch {}
          }
          fireDoneNotification(window.location.href);
          return;
        }

        if (result.status === 'failed') {
          throw new Error(result.error || 'AI generation failed. Please try again.');
        }

        const elapsed = Math.round(attempts * 3.5);
        const pct = Math.min(93, 18 + (attempts / max) * 74);
        setProgress(pct);
        if      (attempts < 10) setPhase(`AI is generating your transformation... (${elapsed}s)`);
        else if (attempts < 30) setPhase(`Still generating — AI is working hard on your video (${elapsed}s)...`);
        else if (attempts < 70) setPhase(`Rendering in progress — almost there (${elapsed}s)...`);
        else                    setPhase(`Final render in progress — hang tight (${elapsed}s)...`);
        try { localStorage.setItem(PENDING_KEY, JSON.stringify({ type:'standard', statusUrl, responseUrl, fmtId:format.id, startedAt:Date.now(), lastProgress:pct, stepIdx:2 })); } catch {}
      }

      throw new Error('Generation timed out after ~9 minutes. The job may still complete — try refreshing.');

    } catch(e) {
      console.error('Generation error:', e.message);
      localStorage.removeItem(PENDING_KEY);
      setError(e.message);
      setScreen('upload');
    }
  };

  const navLabels = {
    upload:'AI TIMELAPSE', processing:'GENERATING', result:'YOUR VIDEO',
    preview:'BID MODE', jobboard:'JOB BOARD', portfolio:'MY PORTFOLIO',
  };

  // Nav uses App-level state (showSiteMenu, showProfileMenu) via closure — no hooks inside
  const Nav = ({ back }) => (
    <nav className="nav" style={{flexWrap:'wrap',gap:8}}>
      <div className="logo" onClick={() => setScreen('home')} style={{cursor:'pointer'}}>
        BUILD<span className="logo-accent">CAST</span>
      </div>

      {/* The Site dropdown — click to open, overlay to close */}
      <div style={{position:'relative'}}>
        <button
          onClick={() => { setShowSiteMenu(o => !o); setShowProfileMenu(false); }}
          style={{
            display:'flex',alignItems:'center',gap:6,
            background: showSiteMenu ? 'var(--s3)' : 'var(--s2)',
            border:'1px solid ' + (showSiteMenu ? 'rgba(245,158,11,0.4)' : 'var(--border)'),
            borderRadius:20,padding:'6px 14px',cursor:'pointer',
            color: showSiteMenu ? 'var(--text)' : 'var(--text-2)',
            fontSize:12,fontWeight:700,letterSpacing:0.3,transition:'all 0.15s',
          }}
        >
          The Site <span style={{fontSize:9,opacity:0.6,marginLeft:2}}>▾</span>
        </button>

        {showSiteMenu && (
          <>
            {/* Invisible full-screen overlay — click anywhere outside to close */}
            <div
              style={{position:'fixed',inset:0,zIndex:299}}
              onClick={() => setShowSiteMenu(false)}
            />
            {/* Dropdown panel */}
            <div style={{
              position:'absolute',top:'calc(100% + 6px)',left:0,zIndex:300,
              background:'var(--s2)',border:'1px solid var(--border)',
              borderRadius:14,minWidth:340,boxShadow:'0 12px 40px rgba(0,0,0,0.6)',
              padding:14,display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,
            }}>
              {/* CREATE column */}
              <div>
                <div style={{fontSize:10,fontWeight:800,letterSpacing:1.5,color:'var(--text-3)',marginBottom:10,paddingLeft:4}}>CREATE</div>
                {[
                  { label:'Timelapse',     desc:'Before → After video',       action:() => { setScreen('upload');    setShowSiteMenu(false); } },
                  { label:'Bid Mode',      desc:'Win jobs with AI renders',    action:() => { goToPreview();          setShowSiteMenu(false); } },
                ].map(item => (
                  <button key={item.label} onClick={item.action} style={{
                    display:'block',width:'100%',padding:'9px 10px',borderRadius:10,
                    background:'none',border:'none',cursor:'pointer',textAlign:'left',
                    marginBottom:2,transition:'background 0.12s',
                  }}
                  onMouseEnter={e => e.currentTarget.style.background='var(--s3)'}
                  onMouseLeave={e => e.currentTarget.style.background='none'}>
                    <div style={{fontWeight:800,fontSize:13,color:'var(--text)'}}>{item.label}</div>
                    <div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>{item.desc}</div>
                  </button>
                ))}
              </div>

              {/* MANAGE column */}
              <div>
                <div style={{fontSize:10,fontWeight:800,letterSpacing:1.5,color:'var(--text-3)',marginBottom:10,paddingLeft:4}}>MANAGE</div>
                {[
                  { label:'Job Board',      desc:'Track active projects',       action:() => { setScreen('jobboard');         setShowSiteMenu(false); } },
                  { label:'My Portfolio',   desc:'Your public work page',       action:() => { setScreen('portfolio');        setShowSiteMenu(false); } },
                  { label:'Brand Settings', desc:'Logo, contact, watermark',    action:() => { setShowSiteMenu(false); if (currentUser) { setShowWatermarkModal(true); } else { setShowLoginModal(true); } } },
                ].map(item => (
                  <button key={item.label} onClick={item.action} style={{
                    display:'block',width:'100%',padding:'9px 10px',borderRadius:10,
                    background:'none',border:'none',cursor:'pointer',textAlign:'left',
                    marginBottom:2,transition:'background 0.12s',
                  }}
                  onMouseEnter={e => e.currentTarget.style.background='var(--s3)'}
                  onMouseLeave={e => e.currentTarget.style.background='none'}>
                    <div style={{fontWeight:800,fontSize:13,color:'var(--text)'}}>{item.label}</div>
                    <div style={{fontSize:11,color:'var(--text-3)',marginTop:2}}>{item.desc}</div>
                  </button>
                ))}
              </div>
            </div>
          </>
        )}
      </div>

      {/* Screen label pill */}
      {navLabels[screen] && screen !== 'home' && !currentUser && (
        <div className="nav-pill">{navLabels[screen]}</div>
      )}

      <div className="nav-user" style={{position:'relative',marginLeft:'auto'}}>
        {currentUser ? (
          <>
            <button
              onClick={() => { setShowProfileMenu(p => !p); setShowSiteMenu(false); }}
              style={{
                display:'flex',alignItems:'center',gap:8,
                background:'var(--s2)',border:'1px solid var(--border)',
                borderRadius:20,padding:'4px 12px 4px 4px',cursor:'pointer',
                color:'var(--text-2)',fontSize:12,fontWeight:600,transition:'all 0.15s',
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor='rgba(245,158,11,0.4)'; e.currentTarget.style.color='var(--text)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor='var(--border)'; e.currentTarget.style.color='var(--text-2)'; }}
            >
              {(userProfile?.avatar || userProfile?.logo)
                ? <img src={userProfile.avatar || userProfile.logo} style={{width:28,height:28,borderRadius:'50%',objectFit:'cover',background:'var(--s3)',flexShrink:0}} />
                : <div style={{width:28,height:28,borderRadius:'50%',flexShrink:0,background:'linear-gradient(135deg,rgba(245,158,11,0.4),rgba(245,158,11,0.15))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,color:'var(--amber)'}}>
                    {currentUser.email[0].toUpperCase()}
                  </div>
              }
              {currentUser.email.split('@')[0]}
              <span style={{fontSize:9,opacity:0.6}}>▾</span>
            </button>

            {showProfileMenu && (
              <>
                <div style={{position:'fixed',inset:0,zIndex:199}} onClick={() => setShowProfileMenu(false)} />
                <div style={{
                  position:'absolute',top:'calc(100% + 8px)',right:0,zIndex:200,
                  background:'var(--s2)',border:'1px solid var(--border)',
                  borderRadius:12,minWidth:200,boxShadow:'0 8px 32px rgba(0,0,0,0.5)',
                  overflow:'hidden',
                }}>
                  <div style={{padding:'10px 14px 6px',fontSize:11,color:'var(--text-3)',borderBottom:'1px solid var(--border)'}}>
                    {currentUser.email}
                  </div>
                  <button
                    onClick={() => { setShowProfileMenu(false); if (currentUser) setShowWatermarkModal(true); }}
                    style={{
                      display:'flex',alignItems:'center',gap:10,width:'100%',
                      padding:'12px 14px',background:'none',border:'none',
                      color:'var(--text)',fontSize:13,fontWeight:600,cursor:'pointer',
                      textAlign:'left',transition:'background 0.15s',
                    }}
                    onMouseEnter={e => e.currentTarget.style.background='var(--s3)'}
                    onMouseLeave={e => e.currentTarget.style.background='none'}
                  >
                    <div>
                      <div>Brand Settings</div>
                      <div style={{fontSize:10,color: (userProfile?.logo||userProfile?.website||userProfile?.phone) ? 'var(--green)' : 'var(--text-3)',marginTop:1}}>
                        {(userProfile?.logo||userProfile?.website||userProfile?.phone) ? '● Active' : 'Not configured'}
                      </div>
                    </div>
                  </button>
                  <button
                    onClick={() => { handleLogout(); setShowProfileMenu(false); }}
                    style={{
                      display:'flex',alignItems:'center',gap:10,width:'100%',
                      padding:'12px 14px',background:'none',border:'none',
                      borderTop:'1px solid var(--border)',
                      color:'var(--text-2)',fontSize:13,fontWeight:600,cursor:'pointer',
                      textAlign:'left',transition:'background 0.15s',
                    }}
                    onMouseEnter={e => e.currentTarget.style.background='var(--s3)'}
                    onMouseLeave={e => e.currentTarget.style.background='none'}
                  >
                    Log out
                  </button>
                </div>
              </>
            )}
          </>
        ) : (
          <button
            onClick={() => setShowLoginModal(true)}
            style={{
              fontSize:12,fontWeight:700,padding:'6px 14px',
              borderRadius:20,border:'1px solid var(--amber)',
              background:'rgba(245,158,11,0.1)',color:'var(--amber)',cursor:'pointer',
            }}
          >Log In</button>
        )}
      </div>
    </nav>
  );

  // Enter preview — gate at Pro tier
  const goToPreview = (beforePhoto = null) => {
    if (!isPro) { setUpgradeTarget('preview'); return; }
    setPreviewBefore(beforePhoto);
    setScreen('preview');
  };

  const [upgradeTarget, setUpgradeTarget] = useState(null); // 'preview' | '30s' | null

  // "Generate Timelapse from Preview" — stash before + after + projType, go to upload screen
  const handleUseAsAfter = ({ before, after, projType: pt }) => {
    setPendingBefore(before || null);
    setPendingAfter(after || null);
    setPendingProjType(pt || null);
    setScreen('upload');
  };

  // BuildCast from Job Board — pre-fill project type and navigate to upload
  const handleBuildCastJob = (job) => {
    setPendingProjType(job.job_type || null);
    setScreen('upload');
  };

  // Upgrade modal config
  const upgradeConfigs = {
    preview: { feature:'Project Preview', tier:'Pro',    price:'$30', planId:'pro'    },
    '30s':   { feature:'30-Second Video',  tier:'Studio', price:'$50', planId:'studio' },
  };

  const upgradeModal = upgradeTarget ? (
    <UpgradeModal
      {...upgradeConfigs[upgradeTarget]}
      onClose={() => setUpgradeTarget(null)}
    />
  ) : null;

  const helpBtn = (
    <>
      {showHelp && <HelpModal currentUser={currentUser} onClose={() => setShowHelp(false)} />}
      {showLoginModal && !currentUser && (
        <AuthModal
          onSuccess={(user, wm) => { handleAuthSuccess(user, wm); setShowLoginModal(false); }}
          onClose={() => setShowLoginModal(false)}
        />
      )}
      {showWatermarkModal && currentUser && (
        <WatermarkSettingsModal
          userProfile={userProfile}
          token={currentUser.token}
          onSave={p => { setUserProfile(p); try { localStorage.setItem('bc_profile', JSON.stringify(p)); } catch {} }}
          onClose={() => setShowWatermarkModal(false)}
        />
      )}
      <button className="help-btn" onClick={() => setShowHelp(true)} title="Need help?"></button>
    </>
  );

  const toastEl = toast ? <Toast msg={toast} onDone={() => setToast(null)} /> : null;
  if (screen === 'propage')      return <PublicPortfolioScreen username={pubPortfolioSlug} />;
  if (screen === 'home')         return <>{upgradeModal}{helpBtn}{toastEl}<Nav /><HomeScreen onStart={() => setScreen('upload')} onPreview={() => goToPreview()} /></>;
  if (screen === 'upload')       return <>{upgradeModal}{helpBtn}{toastEl}<Nav back /><UploadScreen onGenerate={handleGenerate} onPreview={goToPreview} error={error} pendingBefore={pendingBefore} onClearPendingBefore={() => setPendingBefore(null)} pendingAfter={pendingAfter} onClearPendingAfter={() => setPendingAfter(null)} pendingProjType={pendingProjType} onClearPendingProjType={() => setPendingProjType(null)} isPro={isPro} isStudio={isStudio} onUpgrade={setUpgradeTarget} /></>;
  if (screen === 'processing')   return <>{helpBtn}{toastEl}<Nav /><ProcessingScreen progress={progress} phase={phase} stepIdx={stepIdx} notifyEmail={notifyEmail} onSetNotifyEmail={setNotifyEmail} notifyGranted={notifyGranted} /></>;
  if (screen === 'result')       return <>{helpBtn}{toastEl}<Nav back /><ResultScreen videoUrl={videoUrl} videoUrl2={videoUrl2} fmt={fmt} currentUser={currentUser} userProfile={userProfile} onAuthSuccess={handleAuthSuccess} onOpenWatermark={() => setShowWatermarkModal(true)} onStartOver={() => { setVideo(null); setVideo2(null); setError(''); setScreen('upload'); }} /></>;
  if (screen === 'preview')      return <>{helpBtn}{toastEl}<Nav back /><ProjectPreviewScreen initialBefore={previewBefore} onBack={() => setScreen('home')} onUseAsAfter={handleUseAsAfter} token={currentUser?.token} currentUser={currentUser} jobs={jobs} /></>;
  if (screen === 'jobboard')     return <>{helpBtn}{toastEl}<Nav back /><JobBoardScreen token={currentUser?.token} onBuildCast={handleBuildCastJob} onJobsChange={setJobs} onNavigate={setScreen} /></>;
  if (screen === 'portfolio')    return <>{helpBtn}{toastEl}<Nav back /><MyPortfolioScreen token={currentUser?.token} currentUser={currentUser} userProfile={userProfile} /></>;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
